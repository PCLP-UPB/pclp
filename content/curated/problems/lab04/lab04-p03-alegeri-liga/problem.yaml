id: lab04-p03-alegeri-liga
lab: lab04
number: 3
title: "Alegerile din Liga Studenților"
difficulty: 2
estimated_minutes: 20
concepts: [vector de frecvență, inițializarea vectorilor, depășirea limitelor, vector]
statement: |
  La alegerile pentru președintele Ligii Studenților candidează `k` persoane, numerotate
  de la 1 la `k`. Fiecare votant scrie pe buletin numărul unui candidat. Un vot cu un
  număr care nu corespunde niciunui candidat este **anulat**.

  Scrie un program care numără voturile fiecărui candidat, voturile anulate și stabilește
  câștigătorul: candidatul cu cele mai multe voturi; la egalitate câștigă cel cu numărul
  mai mic. Dacă niciun vot nu este valid, nu există câștigător.

  **Date de intrare**

  Pe prima linie, două numere naturale `k n`: numărul de candidați și numărul de voturi.
  Pe a doua linie, `n` numere întregi: voturile.

  **Date de ieșire**

  - `k` linii de forma `Candidat i: V voturi`, pentru `i = 1 … k`;
  - linia `Anulate: A`;
  - linia `Castigator: i` sau, dacă nu există voturi valide, `Castigator: niciunul`.

  **Restricții**

  - `1 ≤ k ≤ 100`
  - `0 ≤ n ≤ 100 000`
  - voturile sunt numere întregi între `-10^9` și `10^9`

  **Exemplu**

  Intrare:
  ```
  4 10
  2 3 2 7 1 3 0 2 3 4
  ```

  Ieșire:
  ```
  Candidat 1: 1 voturi
  Candidat 2: 3 voturi
  Candidat 3: 3 voturi
  Candidat 4: 1 voturi
  Anulate: 2
  Castigator: 2
  ```
hints:
  - "Nu ai nevoie să păstrezi toate voturile, ci doar câte voturi are fiecare candidat: un vector de contoare, indexat chiar după numărul candidatului."
  - "Contoarele trebuie să pornească de la 0. Un vot v este valid doar dacă 1 ≤ v ≤ k — verifică asta înainte de a folosi v ca indice!"
  - "Pentru câștigător, parcurge candidații de la 1 la k și schimbă câștigătorul doar la un număr strict mai mare de voturi; astfel, la egalitate rămâne cel cu numărul mai mic."
pitfalls:
  - "Un vot ca 1000000 sau -3 folosit direct ca indice scrie în afara vectorului."
