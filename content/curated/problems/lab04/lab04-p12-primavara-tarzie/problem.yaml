id: lab04-p12-primavara-tarzie
lab: lab04
number: 12
title: "Primăvara întârziată"
difficulty: 2
estimated_minutes: 25
concepts: [vector, indice, căutare secvențială, constantă simbolică, for]
statement: |
  Meteorologii vor să afle când a venit, de fapt, primăvara. Au temperaturile maxime pentru `n`
  zile consecutive și caută cea mai lungă **perioadă de încălzire**: un șir de zile consecutive
  în care fiecare zi a fost **strict mai caldă** decât cea dinaintea ei. O singură zi formează
  și ea o perioadă (de lungime 1).

  Afișează lungimea celei mai lungi perioade, zilele în care a început și s-a terminat (zilele se
  numerotează de la 1) și temperaturile din acea perioadă. Dacă există mai multe perioade de
  lungime maximă, se alege **prima**.

  **Date de intrare**

  Pe prima linie, `n`. Pe a doua linie, `n` numere întregi: temperaturile, în ordinea zilelor.

  **Date de ieșire**

  - `Lungime: L`
  - `Zilele a-b` (prima și ultima zi a perioadei)
  - temperaturile din perioadă, pe o linie, separate prin câte un spațiu

  **Restricții**

  - `1 ≤ n ≤ 10 000`
  - `-50 ≤ temperatura ≤ 50`

  **Exemplu**

  Intrare:
  ```
  11
  3 5 4 6 8 11 9 10 12 15 2
  ```

  Ieșire:
  ```
  Lungime: 4
  Zilele 3-6
  4 6 8 11
  ```
hints:
  - "O perioadă de încălzire se „rupe” exact acolo unde o zi nu e mai caldă decât precedenta (temperatura scade sau rămâne la fel). Acolo începe o perioadă nouă."
  - "Parcurge zilele o singură dată, ținând minte unde a început perioada curentă. La fiecare zi i, lungimea perioadei curente este i − început + 1; compar-o cu cea mai bună lungime de până acum și, dacă e mai mare, reține și începutul ei."
  - "Actualizează maximul doar la „strict mai mare”, ca să rămână prima perioadă. Inițial, cea mai bună perioadă este ziua 1 (lungime 1). La final afișează elementele de la începutul reținut, pe lungimea reținută."
pitfalls:
  - "Două zile cu aceeași temperatură nu fac parte din aceeași perioadă de încălzire („strict mai caldă”)."
  - "Dacă compari temp[i] cu temp[i + 1] cu i până la n − 1, citești în afara datelor."
