id: lab04-p09-regine-la-panda
lab: lab04
number: 9
title: "Regine la pândă"
difficulty: 4
estimated_minutes: 50
concepts: [vector de frecvență, diagonalele unei matrice, indexare, complexitate]
statement: |
  La cercul de șah al facultății, antrenorul a așezat `q` regine pe o tablă uriașă de
  `n × n` pătrate. Rândurile și coloanele sunt numerotate de la 1 la `n`. O regină atacă
  în cele 8 direcții (pe rând, pe coloană și pe cele două diagonale), dar **nu poate sări**
  peste altă regină: în fiecare direcție atacă doar prima regină întâlnită, dacă există.

  Două regine formează o **pereche de atac** dacă una o atacă pe cealaltă (atunci și a
  doua o atacă pe prima). Afișează:

  - numărul total de perechi de atac;
  - regina atacată de cele mai multe regine (reginele sunt numerotate de la 1, în ordinea
    din fișier); la egalitate, cea cu numărul mai mic.

  **Date de intrare**

  Pe prima linie, două numere naturale `n q`. Pe fiecare dintre următoarele `q` linii,
  două numere naturale `r c`: rândul și coloana unei regine. Nu există două regine pe
  același pătrat.

  **Date de ieșire**

  Două linii:

  ```
  Perechi: P
  Cea mai amenintata: regina i (A atacuri)
  ```

  unde `A` este numărul de regine care o atacă pe regina `i`.

  **Restricții**

  - `1 ≤ n ≤ 100 000`
  - `1 ≤ q ≤ 100 000`
  - `1 ≤ r, c ≤ n`
  - o soluție care compară fiecare pereche de regine este prea lentă

  **Exemplu**

  Intrare:
  ```
  5 6
  1 1
  3 3
  5 5
  3 1
  1 3
  3 5
  ```

  Ieșire:
  ```
  Perechi: 10
  Cea mai amenintata: regina 2 (5 atacuri)
  ```
hints:
  - "Fiecare regină se află pe exact 4 linii: un rând, o coloană și două diagonale. Pe o linie cu k regine, doar vecinele se atacă, deci sunt k − 1 perechi pe acea linie."
  - "Pe o diagonală «\\», r − c este constant; pe una «/», r + c este constant. Adunând un deplasament potrivit (de exemplu r − c + n), obții indici pozitivi, între 1 și 2n − 1, pentru vectori de contoare."
  - "Pentru câte regine o atacă pe o regină dată: pe fiecare dintre cele 4 linii ale ei, are un atacator de o parte dacă nu este prima regină de pe linie, și unul de cealaltă parte dacă nu este ultima. Reține pentru fiecare linie numărul de regine și poziția minimă și maximă (de exemplu coloana, pentru rânduri)."
pitfalls:
  - "Pe o linie cu 3 regine nu sunt 3 perechi de atac, ci 2: regina din mijloc le blochează pe cele de la capete."
  - "r − c poate fi negativ; nu-l folosi direct ca indice."
