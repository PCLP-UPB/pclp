hints:
  - "Toate variantele uniunii ocupă **aceeași** zonă de memorie: după ce scrii `val.r`, valoarea din `val.i` nu mai are sens. De aceea, la orice citire din uniune te uiți întâi la `tip` și folosești doar varianta corespunzătoare (un `switch` pe `tip` e potrivit)."
  - "Pentru detectarea tipului, parcurge șirul cu un pointer: sari peste un eventual `-`, numără cifrele, apoi vezi ce urmează: sfârșitul șirului (`INT`, dacă ai avut măcar o cifră), un punct urmat de 1–2 cifre și sfârșitul șirului (`REAL`), altfel `TEXT`. `true`/`false` se verifică înainte, cu `strcmp`."
  - "Conversia textului în număr se poate face cu `strtoll(v, NULL, 10)` și `strtod(v, NULL)` (din `<stdlib.h>`), iar textul se copiază în `val.s` cu `strcpy`. La `SET` pe o cheie existentă, folosește pointerul returnat de `cauta` și apelează `seteaza` pe aceeași setare — astfel își păstrează locul în listă."
pitfalls:
  - "Dacă la `GET` afișezi `val.i` pentru o setare `REAL`, obții un număr fără sens: biții unui `double` interpretați ca întreg."
  - "`.5`, `5.` și `3.141` nu sunt `REAL` după regulile de aici, iar `-` singur nu e `INT`."
  - "`ADD` pe un `REAL` trebuie să adune la `val.r`, nu la `val.i`, și să lase tipul `REAL`."
