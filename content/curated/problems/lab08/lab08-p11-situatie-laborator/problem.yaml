hints:
  - "Toate informațiile despre un student stau într-o singură variabilă de tip `Student`; grupa este un vector de astfel de structuri. Un câmp se accesează cu punct: `grupa[i].examen`."
  - "La citire, `scanf` are nevoie de adresele câmpurilor: `&grupa[i].lab` (operatorul `.` se aplică înaintea lui `&`). Câmpul `nume` este un vector de caractere, deci se trimite fără `&`."
  - "Nota cu o zecimală se poate afișa direct din puncte: partea întreagă este `p / 10`, iar zecimala `p % 10`. Pentru cea mai mare notă, ține indicele celui mai bun student și schimbă-l doar când găsești un punctaj **strict** mai mare."
pitfalls:
  - "Dacă folosești `double` cu `0.3 * lab + ...`, valoarea exactă 5.0 poate ieși 4.9999… și studentul ar fi declarat restanțier pe nedrept. Lucrează cu puncte întregi."
  - "Nu uita a doua condiție de promovare: cel puțin 5 la examen, indiferent de nota finală."
