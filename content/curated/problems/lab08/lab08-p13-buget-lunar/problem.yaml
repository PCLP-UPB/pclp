id: lab08-p13-buget-lunar
lab: lab08
number: 13
title: "Bugetul lunar"
difficulty: 2
estimated_minutes: 25
concepts: [enumerare, structură, typedef, vector de structuri, strcmp]
statement: |
  Maria, studentă în anul I, își notează toate cheltuielile din luna aceasta, fiecare cu o categorie, o scurtă descriere și suma. La final vrea să vadă cât a cheltuit pe fiecare categorie, ce procent din total reprezintă fiecare și care a fost cea mai mare cheltuială.

  Folosiți tipurile:

  ```c
  typedef enum { MANCARE, TRANSPORT, CHIRIE, DISTRACTIE, ALTELE, NR_CATEGORII } Categorie;

  typedef struct {
      char descriere[31];
      Categorie cat;
      int suma;
  } Cheltuiala;
  ```

  Categoriile se scriu în intrare și se afișează cu litere mici: `mancare`, `transport`, `chirie`, `distractie`, `altele`. Țineți numele lor într-un vector de șiruri indexat cu valorile enumerării și implementați:

  ```c
  Categorie categorie_din_text(const char *s);   /* NR_CATEGORII daca s nu e o categorie */
  ```

  Totalurile pe categorii se țin într-un vector cu `NR_CATEGORII` elemente, indexat tot cu valoarea enumerării. O cheltuială cu o categorie necunoscută (inclusiv scrisă cu majuscule) nu se ia în calcul; pentru ea se afișează `Categorie necunoscuta: <cuvant>`, în ordinea citirii, înaintea raportului.

  **Date de intrare**

  Pe prima linie `n`. Urmează `n` linii de forma `categorie descriere suma`.

  **Date de ieșire**

  Mesajele pentru categoriile necunoscute, apoi câte o linie pentru fiecare categorie, în ordinea din enumerare:

  ```
  <categorie>: <total> lei (<procent>%)
  ```

  unde `procent = 100 · total_categorie / total`, **partea întreagă** (0 dacă totalul general e 0). Urmează `Total: <total> lei` și linia `Cea mai mare cheltuiala: <descriere> (<categorie>) <suma> lei`; la egalitate se alege prima cheltuială validă, în ordinea citirii. Dacă nu există nicio cheltuială validă, ultima linie este `Nicio cheltuiala`.

  **Restricții**

  - `0 ≤ n ≤ 1000`, `1 ≤ suma ≤ 10^6`
  - descrierile au între 1 și 30 de caractere, fără spații; cuvintele pentru categorie au cel mult 30 de caractere

  **Exemplu**

  Intrare:
  ```
  7
  chirie camin 450
  mancare cantina 320
  transport abonament 40
  distractie film 35
  mancare pizza 60
  carti curs_PCLP 25
  altele imprimanta 90
  ```

  Ieșire:
  ```
  Categorie necunoscuta: carti
  mancare: 380 lei (38%)
  transport: 40 lei (4%)
  chirie: 450 lei (45%)
  distractie: 35 lei (3%)
  altele: 90 lei (9%)
  Total: 995 lei
  Cea mai mare cheltuiala: camin (chirie) 450 lei
  ```
