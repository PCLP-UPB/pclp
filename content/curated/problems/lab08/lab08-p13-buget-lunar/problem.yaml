hints:
  - "Valorile unei enumerări sunt întregi consecutivi începând de la 0, deci pot fi folosite direct ca indici: `NUME[CHIRIE]` este `\"chirie\"`, iar `totaluri[v[i].cat] += v[i].suma` adună suma la categoria potrivită. `NR_CATEGORII` pus la final este chiar numărul de categorii."
  - "`categorie_din_text` parcurge categoriile de la `MANCARE` la `NR_CATEGORII - 1` și compară cu `strcmp`; dacă nu găsește nimic, returnează `NR_CATEGORII`, o valoare care nu e categorie validă și pe care o poți testa la apel."
  - "Pentru cea mai mare cheltuială păstrează indicele ei (de exemplu `-1` cât timp nu există niciuna) și schimbă-l doar la o sumă strict mai mare. Procentul se calculează cu împărțire întreagă, după ce verifici că totalul nu e 0."
pitfalls:
  - "`100 · total_categorie` poate trece de limita lui `int` (sumele ajung la 10^9); calculează totalurile în `long long`."
  - "Fără verificarea totalului 0, pentru `n = 0` programul împarte la zero."
