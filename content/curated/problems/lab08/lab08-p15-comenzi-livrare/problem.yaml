hints:
  - "O comandă conține o structură `Ora` ca simplu câmp: ora plasării se accesează cu `c->plasata.h` (întâi `->` pentru pointerul la comandă, apoi `.` pentru câmpul structurii interioare). Ora curentă citită de pe linie se poate copia dintr-o dată: `c->plasata = acum;`."
  - "Ordinea stărilor din enumerare coincide cu ordinea din fluxul comenzii, deci starea următoare este `c->stare + 1` — dar doar dacă starea curentă nu e `LIVRATA` sau `ANULATA` (altfel ai ajunge la `ANULATA` sau chiar la `NR_STARI`)."
  - "Pentru durata livrării, transformă ambele ore în minute de la miezul nopții (`h·60 + m`) și scade. Numărarea finală pe stări se face cu un vector `int numar[NR_STARI]` inițializat cu zero, indexat cu `v[i].stare`. Media se calculează în `double`: `(double)suma / numar_livrate`."
pitfalls:
  - "`AVANS` pe o comandă `LIVRATA` nu trebuie s-o mute în `ANULATA` (valoarea următoare din enumerare)."
  - "La `NOUA` cu un `id` existent, numele clientului trebuie totuși citit de pe linie, altfel e interpretat ca începutul comenzii următoare."
  - "Testează pointerul returnat de `cauta` față de `NULL` înainte de a-l folosi."
