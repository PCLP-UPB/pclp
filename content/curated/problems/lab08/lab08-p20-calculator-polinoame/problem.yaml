hints:
  - "Totul se sprijină pe `adauga_termen`. Ea primește adresa pointerului spre primul nod (`Monom **`), pentru că uneori trebuie să schimbe chiar începutul listei. Parcurge cu un pointer la legătură, `leg`, cât timp nodul `*leg` are gradul mai mare decât `g`; apoi fie `*leg` are exact gradul `g` (aduni coeficientul și, dacă a devenit 0, scoți nodul), fie inserezi un nod nou chiar la `*leg`."
  - "Construiește fiecare rezultat ca listă **nouă**, pornind de la `NULL`: suma = toți termenii lui `P` plus toți termenii lui `Q` (cu semn schimbat la scădere), produsul = câte un `adauga_termen` pentru fiecare pereche de termeni (coeficienții se înmulțesc, gradele se adună), derivata = `c·g` la gradul `g − 1` pentru termenii cu `g > 0`. Abia după ce rezultatul e gata eliberezi lista veche din registrul destinație și pui rezultatul în locul ei — așa `MUL A A A` funcționează corect."
  - "Pentru afișare, tratează separat primul termen (doar `-` dacă e negativ) și pe următorii (` + ` sau ` - `); apoi lucrează cu valoarea absolută a coeficientului: îl scrii doar dacă e diferit de 1 sau dacă gradul e 0; după el, `x` pentru gradul 1 și `x^g` pentru grad mai mare. Lista vidă înseamnă `0`."
pitfalls:
  - "Dacă eliberezi registrul destinație înainte de calcul, la `MUL A A A` sau `DERIV C C` operanzii nu mai există."
  - "Un nod cu coeficientul 0 rămas în listă se afișează greșit (`0x^2`) și strică testul pentru polinomul nul."
  - "La `SET` pe un registru care avea deja un polinom, lista veche trebuie eliberată (altfel memory leak), iar termenii noi nu se adună la cei vechi."
