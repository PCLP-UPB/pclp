id: lab08-p12-maraton-seriale
lab: lab08
number: 12
title: "Maraton de seriale"
difficulty: 1
estimated_minutes: 20
concepts: [structură, typedef, apel prin valoare, atribuirea structurilor, inițializarea structurilor]
statement: |
  Vineri seara, după ultimul colocviu, Andrei își face un maraton de seriale: pornește primul episod la ora `start` și se uită la `n` episoade unul după altul, fără pauze. Afișați la ce oră se termină fiecare episod și cât a durat tot maratonul.

  Folosiți tipul:

  ```c
  typedef struct {
      int h;
      int m;
      int s;
  } Timp;
  ```

  și implementați funcțiile de mai jos, care primesc structuri prin valoare și **returnează** structuri:

  ```c
  long in_secunde(Timp t);
  Timp din_secunde(long sec);      /* m si s intre 0 si 59; h nu se reduce modulo 24 */
  Timp aduna(Timp a, Timp b);
  ```

  Un moment al zilei se afișează `HH:MM:SS` (cu ora între 00 și 23). Dacă un episod se termină după miezul nopții, în altă zi decât cea în care a început maratonul, se adaugă ` (+d)`, unde `d` este numărul de zile trecute de la ziua de start.

  **Date de intrare**

  Pe prima linie ora de start, `HH:MM:SS`. Pe a doua linie `n`. Urmează `n` linii cu durata fiecărui episod, `minute:secunde` (numărul de minute poate depăși 59).

  **Date de ieșire**

  Pentru fiecare episod `i` (de la 1):

  ```
  Episodul <i> se termina la HH:MM:SS
  ```

  eventual urmat de ` (+d)`, apoi linia `Durata totala: <ore>:<MM>:<SS>`, unde orele se afișează fără zerouri în față și pot depăși 23.

  **Restricții**

  - `0 ≤ n ≤ 100`
  - `0 ≤ minute ≤ 1440`, `0 ≤ secunde ≤ 59`

  **Exemplu**

  Intrare:
  ```
  22:30:00
  4
  45:00
  50:30
  42:15
  60:00
  ```

  Ieșire:
  ```
  Episodul 1 se termina la 23:15:00
  Episodul 2 se termina la 00:05:30 (+1)
  Episodul 3 se termina la 00:47:45 (+1)
  Episodul 4 se termina la 01:47:45 (+1)
  Durata totala: 3:17:45
  ```
