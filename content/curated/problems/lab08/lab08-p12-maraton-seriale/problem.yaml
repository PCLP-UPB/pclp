hints:
  - "Cel mai simplu e să faci toate calculele în secunde și să transformi înapoi într-un `Timp` doar la final. O funcție poate returna o structură întreagă, iar rezultatul se poate atribui direct: `ceas = aduna(ceas, durata);`."
  - "`din_secunde`: orele sunt `sec / 3600`, minutele `(sec / 60) % 60`, secundele `sec % 60`. Nu reduce orele modulo 24 aici — ai nevoie de ele ca să știi câte zile au trecut."
  - "La afișare, ora din zi este `ceas.h % 24`, iar numărul de zile trecute este `ceas.h / 24` (se afișează doar dacă e pozitiv). Folosește `%02d` pentru ore, minute și secunde, dar `%d` pentru orele din durata totală."
pitfalls:
  - "Un episod de `0:01` care începe la `23:59:59` se termină la `00:00:00` a doua zi — nu la `24:00:00`."
  - "Structura `total` trebuie inițializată cu zero; o variabilă locală neinițializată conține valori oarecare."
