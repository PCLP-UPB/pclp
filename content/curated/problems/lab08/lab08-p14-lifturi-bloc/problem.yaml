hints:
  - "Funcția de alegere nu returnează o copie a liftului, ci **adresa** lui din vector (`&v[i]`). Astfel, modificările făcute prin acel pointer (`l->etaj = d`) se văd în vectorul din `main`."
  - "Pentru căutare, ține un pointer `best`, inițial `NULL`. Pentru fiecare lift care nu e în revizie: dacă `best` e `NULL` sau liftul curent e strict mai aproape, `best` devine adresa lui. Parcurgând lifturile în ordinea numerelor și folosind „strict”, egalitățile se rezolvă singure."
  - "La `CHEAMA`, afișează mesajul **înainte** de deplasare (are nevoie de etajul curent), apoi apelează `deplaseaza`. Verifică rezultatul lui `alege_lift` față de `NULL` înainte să folosești `->`. Distanța dintre etaje este `abs(a - b)` din `<stdlib.h>`."
pitfalls:
  - "Dacă `alege_lift` returnează o structură (`Lift`) în loc de `Lift *`, deplasarea se face pe o copie și lifturile din vector rămân pe loc."
  - "Accesul `l->id` când `l` e `NULL` (toate lifturile în revizie) oprește programul."
