hints:
  - "O matrice rară e doar un vector de structuri `Element` plus numărul lor. Structura `MatriceRara` e mare, așa că funcțiile o primesc prin pointer (`const` acolo unde doar se citește): `m->e[i].lin`."
  - "Sortează ambele matrice după `(lin, col)`. Două structuri se pot muta direct prin atribuire (`m->e[j + 1] = m->e[j];`). După sortare, diferența se face ca o **interclasare**: avansezi simultan prin `a` și `b` și compari elementele curente."
  - "La interclasare: dacă elementul din `a` e înaintea celui din `b`, el lipsește din `B` și dă `−val`; dacă e invers, elementul din `b` dă `+val`; dacă poziția coincide, valoarea este diferența (și se adaugă doar dacă e nenulă). Nu uita elementele rămase în una dintre matrice după ce cealaltă s-a terminat. Creșterea și scăderea maximă se găsesc la parcurgerea rezultatului, cu comparație strictă."
pitfalls:
  - "O matrice `int m[1000000000][...]` nu se poate declara; lucrează doar cu tripletele."
  - "Fără sortare înainte de interclasare, poziții identice din `A` și `B` nu se mai întâlnesc și apar de două ori în rezultat."
  - "`%+d` afișează și semnul `+` pentru valorile pozitive; `%d` nu."
