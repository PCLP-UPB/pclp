hints:
  - "În interiorul structurii, câmpul `urm` trebuie declarat `struct Vagon *` — numele `Vagon` dat de `typedef` nu există încă în acel punct. Trenul gol are `primul = NULL`; ultimul vagon are `urm = NULL`."
  - "Ca să detașezi ultimele `k` vagoane, mergi `n − k` pași de la începutul listei: vagonul la care ajungi e ultimul care rămâne. Partea de după el se afișează și se eliberează, iar legătura lui devine `NULL`. Dacă rămân 0 vagoane, se modifică chiar `primul` — un pointer la legătură (`Vagon **`) tratează ambele cazuri la fel."
  - "Inversarea pe loc folosește trei pointeri: `anterior` (inițial `NULL`), `p` (vagonul curent) și `urm`. La fiecare pas: salvezi `urm = p->urm`, întorci legătura `p->urm = anterior`, apoi avansezi `anterior = p`, `p = urm`. La final, `primul` devine `anterior`."
pitfalls:
  - "La inversare, dacă schimbi `p->urm` înainte să salvezi vechea valoare, pierzi restul trenului."
  - "După `free(p)`, nu mai ai voie să citești `p->urm`; salvează-l înainte."
  - "`DETASEAZA` pe un tren gol sau cu `k = 0` afișează `Detasate 0:` și nu schimbă nimic."
