id: lab08-p19-playlisturi-clonate
lab: lab08
number: 19
title: "Playlisturi clonate"
difficulty: 4
estimated_minutes: 50
concepts: [copiere profundă, copiere superficială, câmp pointer alocat dinamic, vector de structuri, realloc, vector extensibil, memory leak]
statement: |
  O aplicație de muzică îi permite lui Radu să-și facă playlisturi pentru sesiune și să le **cloneze**: clona pornește cu aceleași piese, dar de acolo înainte e un playlist complet independent — orice modificare făcută în clonă nu se vede în original și invers, iar ștergerea unuia nu îl afectează pe celălalt.

  Folosiți tipurile:

  ```c
  typedef struct {
      char *titlu;        /* alocat dinamic, exact cat e nevoie */
      int durata;         /* in secunde */
  } Piesa;

  typedef struct {
      char *nume;         /* alocat dinamic */
      Piesa *piese;       /* vector alocat dinamic, crescut cu realloc */
      int n, cap;
  } Playlist;
  ```

  și implementați cel puțin:

  ```c
  int adauga_piesa(Playlist *p, const char *titlu, int durata);
  int cloneaza(const Playlist *src, Playlist *dest, const char *nume_nou);   /* copiere profunda */
  void elibereaza_playlist(Playlist *p);
  ```

  Comenzi (pozițiile pieselor se numerotează de la 1):

  | comandă | efect |
  |---|---|
  | `NEW nume` | creează un playlist gol |
  | `ADD nume titlu mm:ss` | adaugă o piesă la finalul playlistului |
  | `CLONE sursa nou` | creează playlistul `nou` ca o copie independentă a lui `sursa` |
  | `RENAME nume poz titlu` | schimbă titlul piesei de pe poziția `poz` (noul titlu poate fi mai lung decât cel vechi) |
  | `REMOVE nume poz` | elimină piesa de pe poziția `poz`; următoarele se mută cu o poziție mai în față |
  | `SHOW nume` | afișează playlistul (formatul de mai jos) |
  | `DELETE nume` | șterge playlistul și eliberează toată memoria lui |

  Mesaje de eroare (comanda se ignoră): `Nu exista: <nume>` dacă playlistul indicat (la `CLONE`, sursa) nu există; `Exista deja: <nume>` dacă la `NEW` sau `CLONE` numele nou e deja folosit; `Pozitie invalida` dacă `poz` nu e între 1 și numărul de piese (se verifică după existența playlistului).

  Formatul lui `SHOW`, cu durata totală și duratele pieselor scrise `<minute>:<SS>` (minutele fără zerouri în față):

  ```
  <nume> (<n> piese, <durata totala>):
    1. <titlu> <durata>
    2. <titlu> <durata>
  ```

  (fiecare piesă pe o linie care începe cu două spații). La final toată memoria trebuie eliberată, fără eliberări duble.

  **Date de intrare**

  Comenzi, câte una pe linie, până la sfârșitul fișierului.

  **Date de ieșire**

  Mesajele comenzilor, în ordine.

  **Restricții**

  - cel mult 2000 de comenzi și cel mult 100 de playlisturi existente în același timp
  - numele și titlurile au între 1 și 100 de caractere, fără spații; `0 ≤ mm ≤ 999`, `0 ≤ ss ≤ 59`

  **Exemplu**

  Intrare:
  ```
  NEW sesiune
  ADD sesiune Lofi_beats 3:25
  ADD sesiune Interstellar_theme 4:41
  ADD sesiune Clair_de_lune 5:03
  CLONE sesiune sesiune_noapte
  RENAME sesiune_noapte 2 Time
  REMOVE sesiune_noapte 1
  ADD sesiune_noapte Nocturne 4:30
  SHOW sesiune
  SHOW sesiune_noapte
  DELETE sesiune
  SHOW sesiune
  SHOW sesiune_noapte
  ```

  Ieșire:
  ```
  sesiune (3 piese, 13:09):
    1. Lofi_beats 3:25
    2. Interstellar_theme 4:41
    3. Clair_de_lune 5:03
  sesiune_noapte (3 piese, 14:14):
    1. Time 4:41
    2. Clair_de_lune 5:03
    3. Nocturne 4:30
  Nu exista: sesiune
  sesiune_noapte (3 piese, 14:14):
    1. Time 4:41
    2. Clair_de_lune 5:03
    3. Nocturne 4:30
  ```
