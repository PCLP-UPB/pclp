hints:
  - "`*dest = *src` copiază doar pointerii (copiere superficială): clona ar folosi **același** vector de piese și **aceleași** titluri ca originalul, deci un `RENAME` în clonă s-ar vedea și în original, iar la `DELETE` aceeași memorie s-ar elibera de două ori. Clona are nevoie de propriile alocări, pe fiecare nivel."
  - "O variantă simplă pentru `cloneaza`: pornești cu un playlist gol (nume duplicat, `piese = NULL`, `n = cap = 0`) și apelezi `adauga_piesa` pentru fiecare piesă a sursei — funcția duplică deja titlul și crește vectorul cu `realloc`."
  - "Ordinea la eliberare: întâi titlul fiecărei piese, apoi vectorul `piese`, apoi numele. La `REMOVE`, eliberează titlul piesei scoase și apoi mută structurile următoare cu o poziție (aici atribuirea de structuri e corectă: e o mutare, poziția veche nu mai e folosită). La `RENAME`, eliberează titlul vechi și pune în locul lui o copie a celui nou."
pitfalls:
  - "`realloc` poate muta vectorul: dacă două playlisturi împart același vector (copiere superficială), după un `ADD` în unul dintre ele celălalt rămâne cu un pointer invalid."
  - "`strcpy` peste titlul vechi la `RENAME` scrie dincolo de memoria alocată dacă titlul nou e mai lung."
  - "La `DELETE` trebuie eliberate și titlurile pieselor, nu doar vectorul."
