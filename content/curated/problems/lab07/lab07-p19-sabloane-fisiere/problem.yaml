hints:
  - "Fără stele, problema e simplă: avansezi cu un pointer în nume și unul în șablon; `?` acceptă orice caracter, restul trebuie să fie egale; la final ambii pointeri trebuie să fie pe `'\\0'`. Toată dificultatea vine de la `*`: câte caractere „înghite”?"
  - "Ideea greedy: când întâlnești o `*`, presupune întâi că înghite zero caractere și ține minte două poziții — unde e steaua în șablon și unde ai ajuns în nume. Dacă mai târziu apare o nepotrivire, nu renunța: revino la caracterul de după ultima stea și lasă steaua să mai înghită **un** caracter din nume. Doar dacă nu ai întâlnit nicio stea, nepotrivirea e definitivă."
  - "Pseudocod: cât timp numele nu s-a terminat: dacă `*p == '*'` → reține `stea = p`, `reluare = s`, avansează `p`; altfel dacă `*p == '?'` sau `*p == *s` → avansează ambii; altfel dacă există `stea` → `p = stea + 1`, `s = ++reluare`; altfel → 0. După buclă, sari peste stelele rămase în șablon; potrivire dacă `*p == '\\0'`. E suficient să revii doar la **ultima** stea."
pitfalls:
  - "Recursivitatea naivă (pentru fiecare `*`, încearcă toate lungimile) e corectă, dar exponențială: testele cu multe stele depășesc timpul."
  - "Nu uita stelele de la finalul șablonului: `tema*` se potrivește cu `tema` (steaua vidă)."
  - "Potrivirea e pe tot numele: `*.c` nu se potrivește cu `tema1.c.bak`, iar `?` nu se potrivește cu caracterul vid."
  - "Eliberează fiecare nume și vectorul de pointeri la final."
