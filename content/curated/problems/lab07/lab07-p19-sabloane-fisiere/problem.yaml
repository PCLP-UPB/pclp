id: lab07-p19-sabloane-fisiere
lab: lab07
number: 19
title: "Căutarea fișierelor după șablon"
difficulty: 4
estimated_minutes: 50
concepts: [șir de caractere, terminator de șir, aritmetică cu pointeri, vector de pointeri la șiruri, malloc]
statement: |
  În terminal, comanda `ls *.c` afișează doar fișierele care se termină în `.c`. Implementați această potrivire după **șablon**: într-un șablon, `?` se potrivește cu **exact un** caracter oarecare, `*` se potrivește cu **orice secvență** de caractere (inclusiv cea vidă), iar orice alt caracter se potrivește doar cu el însuși (literele mari și mici sunt diferite). Un nume se potrivește cu un șablon dacă **tot** numele corespunde **întregului** șablon.

  De exemplu, `tema?.c` se potrivește cu `tema1.c`, dar nu cu `tema10.c`; `*e*` se potrivește cu orice nume care conține litera `e`.

  Numele de fișiere se păstrează într-un vector de pointeri la șiruri alocat dinamic, fiecare nume fiind copiat într-o zonă alocată exact cât îi trebuie. Implementați și folosiți:

  ```c
  int potriveste(const char *s, const char *p);   /* 1 daca numele s se potriveste cu sablonul p */
  ```

  **Atenție la eficiență:** un șablon poate conține multe stele (de exemplu `*a*a*a*a*a*a*a*a*a*a*a*a*b`). O soluție recursivă care încearcă toate variantele pentru fiecare `*` face un număr exponențial de pași și depășește limita de timp; potrivirea unui nume trebuie să facă cel mult de ordinul `lungime(nume) · lungime(sablon)` pași.

  **Date de intrare**

  Pe prima linie `n`. Pe următoarele `n` linii, câte un nume de fișier. Apoi, până la sfârșitul fișierului, câte un șablon pe linie.

  **Date de ieșire**

  Pentru fiecare șablon, o linie `<sablon>: <k>`, unde `k` este numărul de nume care se potrivesc, urmată de cele `k` nume, câte unul pe linie, în ordinea din intrare.

  **Restricții**

  - `1 ≤ n ≤ 200`, cel mult 50 de șabloane
  - numele și șabloanele au între 1 și 100 de caractere; numele conțin doar litere, cifre și `.` `_` `-`; șabloanele pot conține în plus `?` și `*`

  **Exemplu**

  Intrare:
  ```
  7
  tema1.c
  tema2.c
  tema10.c
  tema1.h
  Makefile
  note.txt
  tema_bonus.c
  *.c
  tema?.c
  tema*
  *e*
  ?????
  ```

  Ieșire:
  ```
  *.c: 4
  tema1.c
  tema2.c
  tema10.c
  tema_bonus.c
  tema?.c: 2
  tema1.c
  tema2.c
  tema*: 5
  tema1.c
  tema2.c
  tema10.c
  tema1.h
  tema_bonus.c
  *e*: 7
  tema1.c
  tema2.c
  tema10.c
  tema1.h
  Makefile
  note.txt
  tema_bonus.c
  ?????: 0
  ```
