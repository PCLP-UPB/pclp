hints:
  - "`strchr` îți dă poziția primului `#`, a primului `?` și a primului `=` dintr-o bucată. Punând `'\\0'` pe poziția găsită, „tai” șirul acolo: după `#` → ignori fragmentul; după `=` → cheia și valoarea devin două șiruri separate."
  - "Decodarea micșorează mereu textul (`%41` are 3 caractere, `A` are unul), deci o poți face pe loc, cu un pointer de citire și unul de scriere care rămâne în urmă. Pentru `%`, verifică întâi că următoarele două caractere sunt cifre hexa (`hex(...) >= 0`) — dacă `%` e chiar la final, `r[1]` este `'\\0'`, deci nu citești dincolo de șir."
  - "Ordinea contează: împarte întâi cu `strtok(q + 1, \"&\")`, apoi caută `=` în fiecare token, și abia la final decodează cheia și valoarea. Dacă decodezi tot șirul de la început, `%26` devine `&` și strică împărțirea. Poți ține pointerii la chei și valori în doi vectori `char *`, ca să afișezi numărul de parametri înaintea lor."
pitfalls:
  - "Ignoră `#` înainte să cauți `?`: în `pagina#sectiune?x=1` nu există parametri."
  - "Separă cheia de valoare doar la **primul** `=`; valoarea poate conține și ea `=` (`egal=a=b=c`)."
  - "Codul hexa poate avea litere mari sau mici (`%4a` și `%4A`)."
