id: lab07-p16-parametri-url
lab: lab07
number: 16
title: "Parametrii unei adrese web"
difficulty: 3
estimated_minutes: 40
concepts: [strchr, strtok, token, șir de caractere, terminator de șir, ctype.h]
statement: |
  Un server web primește adrese de forma `https://magazin.ro/cauta?q=laptop+gaming&pret_max=4000#rezultate` și trebuie să extragă parametrii din ele.

  Pentru fiecare adresă:

  1. tot ce urmează după primul `#` (fragmentul) se ignoră, împreună cu `#`;
  2. **șirul de interogare** este partea de după primul `?` din ce a rămas; dacă nu există `?`, adresa nu are parametri;
  3. șirul de interogare se împarte în bucăți după `&`; bucățile vide (de exemplu din `&&`) se ignoră;
  4. fiecare bucată se împarte la **primul** `=` în **cheie** și **valoare**; dacă nu conține `=`, valoarea este vidă; dacă cheia este vidă (bucata începe cu `=`), bucata se ignoră;
  5. abia **după** împărțire, cheia și valoarea se **decodează**: `+` devine spațiu, iar o secvență `%XY`, unde `X` și `Y` sunt cifre hexazecimale (`0`–`9`, `a`–`f`, `A`–`F`), devine caracterul cu codul ASCII `XY` (în baza 16). Un `%` care nu e urmat de două cifre hexazecimale rămâne neschimbat. Așa, `%26` devine `&` și `%3D` devine `=` fără să mai separe ceva. Decodarea se face într-o singură trecere, de la stânga la dreapta: `%2541` devine `%41` (nu `A`).

  Implementați și folosiți funcțiile:

  ```c
  int hex(char c);            /* valoarea cifrei hexa c, sau -1 */
  void decodeaza(char *s);    /* decodare pe loc */
  ```

  **Date de intrare**

  Câte o adresă pe linie, până la sfârșitul fișierului. Ultima linie se poate termina sau nu cu `\n`.

  **Date de ieșire**

  Pentru adresa cu numărul de ordine `i` (de la 1) care are `k` parametri, o linie `URL i: k`, urmată de `k` linii `cheie = "valoare"` (cu cheia și valoarea decodate), în ordinea în care apar în adresă.

  **Restricții**

  - cel mult 200 de adrese, fiecare de cel mult 500 de caractere ASCII afișabile, fără spații
  - orice secvență `%XY` validă se decodează într-un caracter afișabil (cod între 32 și 126)

  **Exemplu**

  Intrare:
  ```
  https://magazin.ro/cauta?q=laptop+gaming&pret_max=4000&sort=pret%20crescator#rezultate
  https://upb.ro/orar
  https://exemplu.ro/?nume=Ion%20Popescu&nota=10&&comentariu=foarte+bine%21&gol=&fara_egal
  ```

  Ieșire:
  ```
  URL 1: 3
  q = "laptop gaming"
  pret_max = "4000"
  sort = "pret crescator"
  URL 2: 0
  URL 3: 5
  nume = "Ion Popescu"
  nota = "10"
  comentariu = "foarte bine!"
  gol = ""
  fara_egal = ""
  ```
