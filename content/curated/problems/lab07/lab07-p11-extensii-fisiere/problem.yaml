hints:
  - "Ai nevoie de **ultima** apariție a unui caracter, de două ori: ultimul `/` din cale și ultimul `.` din nume. `strrchr` face exact asta și returnează `NULL` dacă nu găsește caracterul."
  - "Numele începe la un caracter după ultimul `/`. Caută punctul în nume (nu în toată calea!), altfel punctele din directoare te încurcă. Un pointer care indică în interiorul liniei e suficient — nu trebuie să copiezi numele."
  - "Cazurile fără extensie: `p == NULL`, `p == nume` (punctul e primul caracter), `*(p + 1) == '\\0'` (punctul e ultimul). Altfel copiezi caracterele de după punct, fiecare trecut prin `tolower`, și pui `'\\0'` la final."
pitfalls:
  - "Dacă nu ștergi `\\n`-ul lăsat de `fgets`, extensia devine `\"c\\n\"`, iar `raport.` pare să aibă extensia `\"\\n\"`."
  - "Ultima linie poate să nu aibă `\\n`: nu șterge orbește ultimul caracter, verifică întâi că e `\\n`."
