hints:
  - "Parcurge cele două nume cu doi pointeri `p` și `q` (avansează independent, pentru că numerele egale pot avea lungimi diferite: `007` și `7`). La fiecare pas te uiți dacă `*p` și `*q` sunt ambele cifre (`isdigit`) și alegi regula 1 sau 2."
  - "Cum compari două numere de 100 de cifre fără să le transformi în `long long`? Sari întâi peste zerourile din față; apoi numărul cu mai multe cifre rămase e mai mare; la același număr de cifre, prima cifră diferită decide (exact ca la `strcmp` pe acele cifre)."
  - "Sortarea: inserție sau selecție pe `char **v`, unde în loc de `v[j] > x` scrii `compara_natural(v[j], x) > 0`; interschimbi pointerii, nu conținutul șirurilor. Numele nu au spații, deci le poți citi cu `scanf(\"%100s\", buf)` și copia cu `malloc(strlen(buf) + 1)` + `strcpy`."
pitfalls:
  - "`atoi`/`strtol` pe secvența de cifre dau rezultate greșite peste 19 cifre (depășire)."
  - "Dacă la numere egale returnezi 0 imediat, `a1b2` și `a1b10` ies egale; comparația trebuie să continue după numere."
  - "`img02.jpg` și `img2.JPG` nu sunt egale în ordinea finală: fără departajarea cu `strcmp`, ordinea lor ar depinde de algoritmul de sortare."
  - "Eliberează fiecare nume și apoi vectorul de pointeri."
