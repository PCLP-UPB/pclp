hints:
  - "„Exact un `@`” se verifică elegant cu două căutări: prima apariție (`strchr`) și ultima apariție (`strrchr`) trebuie să existe și să fie aceeași adresă. Apoi pui `'\\0'` în locul lui `@` și ai două șiruri separate: linia și `at + 1`."
  - "Mai multe reguli devin căutări de subșiruri: două puncte consecutive înseamnă `strstr(s, \"..\") != NULL`; o etichetă care începe sau se termină cu `-` apare ca `\".-\"`, `\"-.\"`, sau `-` pe prima/ultima poziție. Etichetă vidă = `..`, ori `.` la început sau la final. Ultima etichetă începe după `strrchr(dom, '.')`."
  - "Pentru „caracter permis” la partea locală, `isalnum(c) || strchr(\"._-+\", c) != NULL` e mai scurt decât patru comparații. Verifică toate caracterele întâi, apoi regulile de poziție. La final transformă domeniul cu `tolower` și afișează cele două bucăți cu `@` între ele."
pitfalls:
  - "`strchr(\"._-+\", c)` returnează un pointer nenul și pentru `c == '\\0'` (găsește terminatorul). Aici nu contează, pentru că parcurgi doar caracterele dinaintea lui `'\\0'`, dar e o capcană clasică."
  - "Nu uita că linia poate avea spații la final și `\\n`: dacă nu le ștergi, ultima etichetă `ro\\n` nu mai are doar litere."
  - "O linie goală sau doar cu spații trebuie să dea `NU`, nu să fie sărită."
