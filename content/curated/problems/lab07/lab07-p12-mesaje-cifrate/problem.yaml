hints:
  - "O literă mică `c` are poziția `c - 'a'` în alfabet (0 pentru `a`, 25 pentru `z`). Adună `k`, ia restul împărțirii la 26 și adaugă înapoi `'a'`. La fel pentru litere mari, cu `'A'`."
  - "Pentru `k` negativ, `%` în C poate da rest negativ (`-1 % 26 == -1`). Adu `k` o singură dată în intervalul `[0, 25]` cu `((k % 26) + 26) % 26` — o deplasare cu `-1` e totuna cu o deplasare cu `25`."
  - "`scanf(\"%d\")` lasă în intrare `\\n`-ul de după `k`; primul `fgets` l-ar citi ca pe un mesaj gol. Consumă caracterele cu `getchar()` până la `\\n` inclusiv, apoi citește mesajele cu `fgets` și șterge `\\n`-ul de la final înainte de afișare."
pitfalls:
  - "Dacă nu consumi `\\n`-ul rămas după `scanf`, apare o linie goală în plus la începutul ieșirii."
  - "Folosește `isupper`/`islower`, nu `isalpha` urmat de `+ k`: altfel `z` devine un caracter care nu e literă."
  - "Dacă scrii întâi `s[i] = s[i] + k` și abia apoi corectezi, pentru `k` mare valoarea nu mai încape în `char`. Calculează poziția nouă în `int` și abia la final o pui în șir."
