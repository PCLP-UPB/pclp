id: lab07-p12-mesaje-cifrate
lab: lab07
number: 12
title: "Mesajele cercului de criptografie"
difficulty: 1
estimated_minutes: 20
concepts: [șir de caractere, fgets, isupper, islower, cod ASCII, caracterul linie nouă]
statement: |
  Membrii cercului de criptografie își trimit mesaje cifrate cu **cifrul lui Caesar**: fiecare literă se înlocuiește cu litera aflată cu `k` poziții mai departe în alfabetul englez, circular (după `z` urmează din nou `a`). Literele mari rămân mari, literele mici rămân mici, iar orice alt caracter (cifre, spații, punctuație) rămâne neschimbat. Un `k` negativ înseamnă deplasare înapoi — așa se descifrează un mesaj cifrat cu `-k`.

  De exemplu, pentru `k = 3`: `a → d`, `x → a`, `Z → C`; pentru `k = -1`: `a → z`.

  Implementați și folosiți funcția:

  ```c
  void cifreaza(char *s, int k);   /* modifica sirul pe loc */
  ```

  **Date de intrare**

  Pe prima linie, numărul întreg `k` (singur pe linie). Pe următoarele linii, până la sfârșitul fișierului, mesajele de cifrat, câte unul pe linie. Un mesaj poate fi și o linie goală. Ultima linie se poate termina sau nu cu `\n`.

  **Date de ieșire**

  Pentru fiecare mesaj, o linie cu mesajul cifrat (o linie goală pentru un mesaj gol).

  **Restricții**

  - `-1000 ≤ k ≤ 1000`
  - cel mult 1000 de mesaje, fiecare de cel mult 200 de caractere ASCII afișabile (fără `\n`)

  **Exemplu**

  Intrare:
  ```
  3
  Intalnire la Zebra, ora 18:30!
  xyz ABC

  Parola: Cafea2025
  ```

  Ieșire:
  ```
  Lqwdoqluh od Cheud, rud 18:30!
  abc DEF

  Sdurod: Fdihd2025
  ```
