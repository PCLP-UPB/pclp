      return 0;
  }

  int main(void)
  {
      char linie[LMAX];
      char *cuv[CMAX];

      while (fgets(linie, LMAX, stdin) != NULL) {
          /* TODO: imparte linia, apoi afiseaza cuvintele de la ultimul la primul */
      }
      return 0;
  }
hints:
  - "`strtok` sare peste oricâți delimitatori consecutivi, deci spațiile multiple și cele de la capete nu-ți mai dau bătăi de cap. Primul apel primește linia, următoarele primesc `NULL`, până când funcția returnează `NULL`."
  - "Nu trebuie să copiezi cuvintele: `strtok` pune `'\\0'` după fiecare cuvânt chiar în linie, deci pointerii returnați sunt deja șiruri corecte. Îi păstrezi într-un vector `char *cuv[]` și apoi îl parcurgi de la coadă."
  - "Pune și `'\\n'` în lista de delimitatori, ca ultimul cuvânt să nu-l conțină. Spațiul se afișează doar *între* cuvinte: înaintea fiecărui cuvânt în afară de primul afișat, sau după fiecare în afară de ultimul."
pitfalls:
  - "Pointerii din `cuv` indică în `linie`; după următorul `fgets` ei arată textul liniei noi. E în regulă aici, pentru că afișezi linia înainte să citești următoarea."
  - "Dacă uiți tab-ul (`\\t`) din delimitatori, cuvintele separate prin tab rămân lipite."
