hints:
  - "Dacă împarți calea cu `strtok(cale, \"/\")`, slash-urile multiple și cele de la capete dispar singure; rămân doar componentele. Gândește-te la componentele păstrate ca la o **stivă**: un nume obișnuit se pune deasupra, `..` scoate ultimul nume (dacă există)."
  - "Stiva poate fi un vector de pointeri `char *comp[]` care indică direct în șirul împărțit de `strtok` — nu ai nevoie de copii. La final construiești rezultatul cu `strcat`: pentru fiecare componentă, `\"/\"` și apoi numele; dacă stiva e goală, rezultatul este `\"/\"`."
  - "O cale relativă devine absolută dacă o lipești de directorul curent: `curent + \"/\" + cale` într-un buffer separat (de exemplu `/home/student` + `/` + `../x`). Apoi aplici `simplifica` pe acest buffer, cu rezultatul scris direct în `curent`. Nu folosi același buffer și ca sursă, și ca destinație."
pitfalls:
  - "Pointerii din stivă indică în bufferul împărțit de `strtok`; dacă scrii rezultatul chiar în acel buffer, îți suprascrii componentele înainte să le copiezi."
  - "Compară componentele cu `strcmp(p, \"..\") == 0`, nu cu `p == \"..\"` (asta compară adrese)."
  - "`...` și `.ascuns` sunt nume obișnuite, nu componente speciale."
  - "Nu uita `\\n`-ul de la finalul liniei: `cd ..\\n` ar adăuga o componentă numită `..\\n`."
