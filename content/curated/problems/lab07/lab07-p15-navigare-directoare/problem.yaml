id: lab07-p15-navigare-directoare
lab: lab07
number: 15
title: "Navigarea prin directoare"
difficulty: 3
estimated_minutes: 35
concepts: [strtok, token, strcmp, strcat, vector de pointeri, stivă]
statement: |
  Simulați comenzile `cd` și `pwd` dintr-un terminal Linux. Programul ține minte **directorul curent**, mereu sub forma canonică:

  - începe cu `/` și componentele sunt separate prin câte **un singur** `/`;
  - nu se termină cu `/` (cu excepția rădăcinii, care este chiar `/`);
  - nu conține componentele speciale `.` și `..`.

  O cale oarecare se citește componentă cu componentă (componentele sunt separate prin unul sau mai multe `/`): `.` înseamnă „directorul în care sunt” și se ignoră; `..` înseamnă „directorul părinte” și elimină ultima componentă păstrată (din rădăcină, `..` rămâne în rădăcină); orice altă componentă (inclusiv `...` sau `.ascuns`) este un nume obișnuit de director. O cale care începe cu `/` este **absolută**; altfel este **relativă** la directorul curent.

  Comenzile:

  - `cd <cale>` — directorul curent devine cel indicat de cale (nu verificăm dacă directorul există);
  - `pwd` — afișează directorul curent.

  Implementați și folosiți funcția:

  ```c
  void simplifica(char *cale, char *rez);   /* cale absoluta -> forma canonica in rez (cale se poate modifica) */
  ```

  **Date de intrare**

  Pe prima linie, directorul inițial: o cale absolută, nu neapărat canonică. Pe următoarele linii, până la sfârșitul fișierului, câte o comandă: `pwd`, sau `cd`, un spațiu și o cale nevidă. Ultima linie se poate termina sau nu cu `\n`.

  **Date de ieșire**

  Pentru fiecare comandă `pwd`, o linie cu directorul curent.

  **Restricții**

  - cel mult 1000 de comenzi; fiecare linie are cel mult 300 de caractere, fără spații în căi
  - numele componentelor conțin doar litere, cifre și caracterele `.` `_` `-`
  - directorul curent (în forma canonică) nu depășește niciodată 1000 de caractere

  **Exemplu**

  Intrare:
  ```
  /home/student
  pwd
  cd teme/pclp
  pwd
  cd ../../poze//2024/
  pwd
  cd /etc/./ssh/..
  pwd
  cd ../../../..
  pwd
  ```

  Ieșire:
  ```
  /home/student
  /home/student/teme/pclp
  /home/student/poze/2024
  /etc
  /
  ```
