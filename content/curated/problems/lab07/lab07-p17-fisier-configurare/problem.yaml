id: lab07-p17-fisier-configurare
lab: lab07
number: 17
title: "Fișierul de configurare"
difficulty: 3
estimated_minutes: 40
concepts: [vector de pointeri la șiruri, strchr, strcmp, strcat, malloc, spațiu pentru terminator, tolower]
statement: |
  Multe programe își citesc setările dintr-un fișier de configurare în format INI. Scrieți cititorul de configurare și răspundeți la interogări.

  Fiecare linie de configurare se prelucrează după ce i se elimină spațiile și tab-urile de la început și de la final:

  - o linie goală, sau care începe cu `;` sau `#`, este comentariu și se ignoră;
  - o linie care începe cu `[` și se termină cu `]` deschide o **secțiune**: numele ei este textul dintre paranteze, fără spațiile de la capete; setările următoare aparțin acestei secțiuni; `[]` revine la secțiunea globală (fără nume), cea în care sunt și setările de la începutul fișierului;
  - o linie care conține `=` este o **setare**: cheia este textul dinaintea **primului** `=`, valoarea este textul de după el, ambele fără spațiile de la capete; valoarea poate fi vidă și poate conține orice (inclusiv `=`, `;`, `[`); dacă cheia e vidă, linia se ignoră;
  - orice altă linie se ignoră.

  Numele complet al unei setări este `sectiune.cheie`, sau doar `cheie` în secțiunea globală. Numele secțiunilor și cheile **nu țin cont de majuscule**: se memorează cu litere mici. Dacă aceeași setare apare de mai multe ori (chiar și în secțiuni redeschise), contează ultima valoare.

  Numele complete și valorile se păstrează în doi vectori de pointeri la șiruri, fiecare șir fiind alocat exact cât îi trebuie.

  **Date de intrare**

  Liniile de configurare, apoi o linie `---` (eventual cu spații în jur), apoi interogările până la sfârșitul fișierului: câte un nume complet pe linie, eventual cu spații în jur și cu orice fel de litere. Doar prima linie `---` este separator; liniile de după ea sunt toate interogări. Ultima linie se poate termina sau nu cu `\n`.

  **Date de ieșire**

  Pentru fiecare interogare, cu numele scris cu litere mici și fără spațiile de la capete: `nume = valoare` dacă setarea există, altfel `nume: nedefinit`.

  **Restricții**

  - cel mult 1000 de linii de configurare și 1000 de interogări, fiecare linie de cel mult 300 de caractere ASCII (afișabile sau tab)
  - numele secțiunilor și cheile nu conțin caracterele `.` `[` `]` `=`; interogările sunt nevide

  **Exemplu**

  Intrare:
  ```
  ; configurarea serverului de teme
  nume = Verificator PCLP
  [Server]
  port = 8080
  gazda=  localhost
  [baza de date]
  utilizator = admin
  parola = s3cret = da
  [server]
  PORT = 9090
  ---
  nume
  server.port
  Server.Gazda
  baza de date.parola
  server.timeout
  port
  ```

  Ieșire:
  ```
  nume = Verificator PCLP
  server.port = 9090
  server.gazda = localhost
  baza de date.parola = s3cret = da
  server.timeout: nedefinit
  port: nedefinit
  ```
