hints:
  - "Toată prelucrarea începe cu aceeași operație: „curățarea” capetelor. Șterge de la final `\\n`, spațiile și tab-urile punând `'\\0'` mai devreme, iar pentru început returnează un pointer avansat peste spații. O vei folosi pe linie, pe numele secțiunii, pe cheie și pe valoare."
  - "Pentru o setare, `strchr(s, '=')` găsește primul `=`; pune acolo `'\\0'` și ai două șiruri: cheia (`s`) și valoarea (după `=`). Curăță-le separat. Numele complet se construiește într-un buffer cu `strcpy` + `strcat` (`sectiune`, `\".\"`, `cheie`) sau doar din cheie, dacă secțiunea curentă e vidă."
  - "Memorarea: doi vectori `char *nume[]` și `char *val[]` cu aceeași poziție pentru aceeași setare. Înainte de adăugare caută numele cu `strcmp`; dacă există, eliberează valoarea veche și pune o copie a celei noi. Copiile se fac cu `malloc(strlen(s) + 1)` + `strcpy`, fiindcă bufferul liniei se suprascrie la următorul `fgets`."
pitfalls:
  - "Dacă pui în vector direct pointerul în bufferul `linie` (fără copie), după citirea liniei următoare toate valorile se schimbă."
  - "La înlocuirea unei valori, eliberează copia veche, altfel ai memory leak."
  - "`[ Retea ]` și `[retea]` sunt aceeași secțiune — curăță și transformă în litere mici numele secțiunii, nu doar cheile."
  - "Comentariile se recunosc doar la începutul liniei: în `ip = 10.0.0.1 ; x`, textul `; x` face parte din valoare."
