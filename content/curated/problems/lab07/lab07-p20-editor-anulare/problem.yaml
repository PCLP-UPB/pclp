hints:
  - "Desparte comanda în nume și argumente cu `strchr(linie, ' ')`: pune `'\\0'` pe primul spațiu și compară numele cu `strcmp`. Numerele le citești cifră cu cifră (sau cu `strtol`), avansând un pointer; după `p` sari exact **un** spațiu — ce rămâne este textul de inserat, cu spațiile lui."
  - "Inserarea lui `s` (lungime `m`) la poziția `p`: `realloc` la `len + m + 1`, apoi mută cele `len - p + 1` caractere de la `p` (inclusiv `'\\0'`) cu `m` poziții la dreapta, apoi copiază `s` în gol. Ștergerea: mută coada `[p + k, len]` (inclusiv `'\\0'`) la poziția `p`, apoi micșorează cu `realloc`. Zonele se suprapun, deci mutarea se face cu `memmove`, nu cu `memcpy` sau `strcpy`."
  - "UNDO cu instantanee: înainte de fiecare modificare **reușită**, pune în stivă o copie a textului curent. La `UNDO`, eliberezi textul curent și îl înlocuiești cu pointerul din vârful stivei (fără altă copie). Verifică toate condițiile de eroare **înainte** să salvezi ceva sau să modifici clipboard-ul. Atenție la comparațiile cu `size_t`: `p + k > len` se scrie sigur ca `k > len - p` după ce ai verificat `p <= len`."
pitfalls:
  - "`memcpy` și `strcpy` pe zone suprapuse au comportament nedefinit: textul se poate strica „uneori”, în funcție de bibliotecă."
  - "Dacă uiți să muți și `'\\0'`, textul rămâne cu caractere vechi la final după o ștergere."
  - "Rezultatul lui `realloc` poate fi altă adresă: folosește-l pe acesta, nu vechiul pointer. De aceea funcțiile primesc `char **t`."
  - "O comandă eronată nu trebuie să intre în istoric: altfel `UNDO` ulterior „anulează” ceva ce nu s-a întâmplat."
  - "La `CUT`, clipboard-ul vechi trebuie eliberat; la final, eliberează textul, clipboard-ul, fiecare stare din istoric și vectorul istoricului."
