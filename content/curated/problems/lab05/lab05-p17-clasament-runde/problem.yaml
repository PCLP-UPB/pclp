hints:
  - "Nu sortezi punctaje, ci pointeri spre linii. Interschimbarea a doi pointeri dintr-un vector de pointeri are nevoie de adresele lor, adică de pointeri la pointeri (`int **`)."
  - "Linia jucătorului `j` (de la 0) începe la `puncte + j·m`, deci din pointerul spre linie afli `j` împărțind la `m` diferența față de `puncte`. Pentru al treilea criteriu poți compara direct cei doi pointeri: ambii indică în același vector."
  - "Pseudocod sortare prin selecție: pentru fiecare poziție p din linii (până la penultima): best = p; pentru fiecare q de după p: dacă compara(linia de la q, linia de la best, m) < 0 atunci best = q; schimba(p, best). Afișarea parcurge linii[0..n−1] și, pentru fiecare, cele m valori prin pointer."
pitfalls:
  - "`schimba(int *x, int *y)` ar interschimba întregi (primele punctaje), nu pointerii — clasamentul iese greșit, iar datele originale se strică (se vede în ultima linie)."
  - "Dacă uiți criteriul 3, sortarea poate schimba ordinea jucătorilor egali; comparația de adrese e validă doar pentru pointeri în același vector."
  - "Diferența de pointeri `linii[i] - puncte` dă numărul de **elemente**, nu de octeți; împarte la `m`, nu la `sizeof`."
