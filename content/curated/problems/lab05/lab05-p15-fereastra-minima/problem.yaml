hints:
  - "Funcția trebuie să întoarcă două lucruri: o lungime (prin `return`) și o adresă. Ca să modifice un pointer din `main`, primește adresa acelui pointer — un pointer la pointer."
  - "Tehnica „fereastră glisantă”: un pointer `dr` avansează peste fiecare element și îl adaugă la sumă; un pointer `st` avansează cât timp elementul de la `st` poate fi scos fără ca suma să scadă sub `S`. Fiindcă valorile sunt pozitive, niciunul dintre pointeri nu se întoarce, deci totul e `O(n)`."
  - "Pseudocod: st = v; suma = 0; best = 0; pentru dr de la v la v+n-1: suma += valoarea de la dr; cât timp suma − valoarea de la st ≥ S: scade-o și avansează st; dacă suma ≥ S și (best = 0 sau dr − st + 1 < best): best = dr − st + 1, iar la adresa start scrie st. Comparația strictă păstrează perioada care începe cel mai devreme."
pitfalls:
  - "Un parametru `const int *start` (fără a doua stea) ar fi o copie: modificarea lui în funcție nu se vede în `main`."
  - "Dacă în `main` calculezi `start - v` când funcția a returnat 0, `start` este `NULL` și rezultatul nu are sens — verifică întâi lungimea."
  - "Cu `<=` la actualizarea minimului se reține ultima perioadă de lungime minimă, nu prima."
