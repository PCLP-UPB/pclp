hints:
  - "O funcție C întoarce o singură valoare prin `return`. Ca să „întoarcă” patru, primește adresele unor variabile din `main` și scrie la acele adrese cu `*`."
  - "Inițializează minimul și maximul cu primul element (și ziua 1), apoi compară fiecare element următor. Nu porni de la 0: temperaturile pot fi negative."
  - "Pseudocod: *min = *max = v[0]; pentru fiecare p de la v+1 la v+n-1: dacă *p < *min atunci *min = *p și *zi_min = (p - v) + 1; analog pentru maxim. Comparațiile stricte păstrează prima apariție."
pitfalls:
  - "Apelul `extreme(temp, n, min, ...)` fără `&` trimite valoarea (neinițializată) în loc de adresă — compilatorul dă warning, iar programul se poate opri cu segmentation fault."
  - "Cu `<=` în loc de `<` se reține ultima apariție a extremului, nu prima."
