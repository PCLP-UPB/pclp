id: lab05-p11-suma-fractii
lab: lab05
number: 11
title: "Suma fracțiilor"
difficulty: 1
estimated_minutes: 20
concepts: [parametru de tip pointer, operatorul de referențiere, operatorul de dereferențiere, pointer, funcție]
statement: |
  Un contabil adună, una după alta, `n` fracții de forma `a/b`. După fiecare fracție adunată, afișați suma parțială (suma primelor fracții citite până atunci) în **formă ireductibilă**, cu numitorul pozitiv. Dacă numitorul formei ireductibile este 1, afișați doar numărătorul (de exemplu `2`, `0`, `-3`).

  Suma parțială se ține în două variabile din `main` (numărătorul și numitorul), iar funcțiile le modifică prin pointeri. Implementați și folosiți:

  ```c
  long long cmmdc(long long a, long long b);
  void simplifica(long long *p, long long *q);   /* aduce *p / *q la forma ireductibila, *q > 0 */
  void aduna(long long *p, long long *q, long long a, long long b);   /* *p / *q += a / b */
  ```

  **Date de intrare**

  Pe prima linie `n`. Pe fiecare dintre următoarele `n` linii, o fracție scrisă `a/b` (fără spații; `a` și `b` pot fi negative).

  **Date de ieșire**

  `n` linii: pe linia `i`, suma primelor `i` fracții, în forma `p/q` sau doar `p` dacă `q = 1`. Semnul minus, dacă există, stă în fața numărătorului.

  **Restricții**

  - `1 ≤ n ≤ 100`
  - `-1000 ≤ a ≤ 1000`, `1 ≤ |b| ≤ 20`
  - toate calculele încap în `long long` dacă simplificați după fiecare adunare

  **Exemplu**

  Intrare:
  ```
  4
  1/2
  1/3
  -5/6
  3/-4
  ```

  Ieșire:
  ```
  1/2
  5/6
  0
  -3/4
  ```

  Explicație: `1/2 + 1/3 = 5/6`, `5/6 - 5/6 = 0`, `0 + 3/(-4) = -3/4`.
