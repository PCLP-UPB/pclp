hints:
  - "Suma parțială are două componente, deci o funcție nu o poate „returna” cu `return`. Trimite adresele celor două variabile din `main`, iar funcția scrie la acele adrese."
  - "Adunarea: `p/q + a/b = (p·b + a·q) / (q·b)`. Imediat după adunare, simplifică: dacă numitorul e negativ, schimbă semnul ambelor componente, apoi împarte-le la cmmdc-ul valorilor absolute. Suma inițială este `0/1`."
  - "Pseudocod pentru simplifica(p, q): dacă valoarea de la q < 0 atunci neagă valorile de la p și q; d = cmmdc(valoarea de la p, valoarea de la q); dacă d > 1 împarte ambele valori la d. Observă că cmmdc(0, q) = q, deci 0 devine `0/1`."
pitfalls:
  - "În funcție, `p = p * b + ...` modifică pointerul, nu valoarea; ai nevoie de `*p`. Compilatorul dă eroare sau warning — citește-l."
  - "Dacă uiți să normalizezi semnul, `3/-4` se afișează greșit și cmmdc-ul poate ieși negativ."
  - "`%` cu operanzi negativi dă rest negativ în C; lucrează în cmmdc cu valori absolute."
