hints:
  - "Produsele cu prețul în `[a, b]` formează o zonă contiguă a vectorului sortat: începe la primul preț ≥ a și se termină înainte de primul preț > b. Numărul lor este diferența dintre aceste două adrese."
  - "Căutarea binară pe pointeri: cât timp zona `[st, sf)` nu e vidă, ia mijlocul `st + (sf - st) / 2`; dacă valoarea de acolo e prea mică, zona devine `[mij + 1, sf)`, altfel `[st, mij)`. La final `st == sf` este răspunsul."
  - "Pseudocod în main: st = primul_cel_putin(pret, pret + n, a); sf = primul_peste(pret, pret + n, b); dacă st ≥ sf afișează 0, altfel afișează sf - st, (st - pret) + 1, sf - pret. Condiția st ≥ sf acoperă și cazul a > b."
pitfalls:
  - "Mijlocul nu se poate calcula ca `(st + sf) / 2`: suma a doi pointeri nu are sens în C (eroare de compilare). Folosește `st + (sf - st) / 2`."
  - "Zona este semideschisă: `sf` nu se dereferențiază niciodată, poate fi chiar adresa de după ultimul element."
  - "Cu `<` în loc de `<=` în `primul_peste` obții același lucru ca în `primul_cel_putin` și pierzi produsele cu prețul exact `b`."
