id: lab05-p14-preturi-interval
lab: lab05
number: 14
title: "Produse într-un interval de preț"
difficulty: 3
estimated_minutes: 35
concepts: [pointer returnat de funcție, aritmetică cu pointeri, const, echivalența dintre vector și pointer]
statement: |
  Un magazin online are `n` produse, cu prețurile (în lei) sortate **crescător** (pot exista prețuri egale). Clienții filtrează produsele după preț: pentru fiecare dintre cele `q` filtre `a b`, afișați câte produse au prețul în intervalul `[a, b]` și pozițiile (numerotate de la 1) primului și ultimului dintre ele în lista sortată.

  Implementați și folosiți două funcții de **căutare binară** care lucrează pe zona `[st, sf)` (de la `st` inclusiv până la `sf` exclusiv) și returnează adrese:

  ```c
  const int *primul_cel_putin(const int *st, const int *sf, int x);   /* primul element >= x, sau sf */
  const int *primul_peste(const int *st, const int *sf, int x);       /* primul element > x, sau sf */
  ```

  Numărul de produse și pozițiile se calculează în `main` **doar prin diferențe de pointeri** între rezultatele celor două funcții și începutul vectorului.

  **Date de intrare**

  Pe prima linie `n`, pe a doua `n` prețuri sortate crescător. Pe a treia linie `q`, apoi `q` linii cu câte două numere `a b`.

  **Date de ieșire**

  Pentru fiecare filtru, o linie: `k prim ultim` (numărul de produse și pozițiile primului și ultimului), sau `0` dacă niciun produs nu are prețul în interval (inclusiv când `a > b`).

  **Restricții**

  - `1 ≤ n ≤ 100000`, `1 ≤ q ≤ 100000`
  - prețurile și `a`, `b` sunt întregi din `[0, 10^9]`
  - soluția trebuie să răspundă fiecărui filtru în `O(log n)` (o parcurgere liniară pe filtru este prea lentă)

  **Exemplu**

  Intrare:
  ```
  8
  5 10 10 20 35 35 35 50
  6
  10 35
  0 4
  36 49
  50 100
  1 1000
  20 10
  ```

  Ieșire:
  ```
  6 2 7
  0
  0
  1 8 8
  8 1 8
  0
  ```
