id: lab05-p16-colier-simetric
lab: lab05
number: 16
title: "Colierul simetric"
difficulty: 3
estimated_minutes: 40
concepts: [aritmetică cu pointeri, parametru de tip pointer, expresii complexe cu pointeri, operatorul de dereferențiere]
statement: |
  Un bijutier are un șirag de `n` mărgele, fiecare cu o greutate (număr întreg pozitiv). Singura operație permisă este **contopirea** a două mărgele vecine într-una singură, cu greutatea egală cu suma greutăților lor (șiragul scade cu o mărgea). Bijutierul vrea ca șiragul să devină **simetric**: șirul greutăților citit de la stânga la dreapta să fie identic cu cel citit de la dreapta la stânga.

  Aflați numărul **minim** de contopiri necesare și afișați șiragul simetric obținut.

  Se poate demonstra că strategia următoare este optimă: se privesc mărgelele de la cele două capete; dacă au greutăți egale, rămân în șirag și se trece la următoarele două spre interior; altfel, mărgeaua mai ușoară dintre cele două se contopește cu vecina ei spre interior.

  Implementați și folosiți funcția:

  ```c
  int fa_simetric(int *st, int *dr, int *jumatate, int *nr_jum, int *mijloc);
  ```

  unde `st` și `dr` sunt adresele primei și ultimei mărgele (capete **inclusive**). Funcția parcurge șiragul cu cei doi pointeri, returnează numărul de contopiri, scrie în vectorul `jumatate` greutățile perechilor egale găsite (de la exterior spre interior), la adresa `nr_jum` numărul lor și la adresa `mijloc` greutatea mărgelei din centru (0 dacă șiragul final are un număr par de mărgele). Nu folosiți operatorul `[]` în această funcție.

  **Date de intrare**

  Pe prima linie `n`, pe a doua `n` întregi pozitivi — greutățile, de la stânga la dreapta.

  **Date de ieșire**

  Pe prima linie numărul minim de contopiri. Pe a doua linie greutățile șiragului final, separate prin spațiu.

  **Restricții**

  - `1 ≤ n ≤ 100000`, `1 ≤` greutate `≤ 10000`
  - suma tuturor greutăților încape în `int`

  **Exemplu**

  Intrare:
  ```
  7
  3 1 2 4 3 1 2
  ```

  Ieșire:
  ```
  2
  3 3 4 3 3
  ```

  Explicație: capetele `3` și `2` diferă, deci `2` se contopește cu `1` (→ `3`); apoi `1` se contopește cu `2` (→ `3`) și rămâne `3 3 4 3 3`.
