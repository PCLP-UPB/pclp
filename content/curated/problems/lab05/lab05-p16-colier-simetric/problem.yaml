hints:
  - "Lucrează cu doi pointeri, unul la fiecare capăt, care se apropie. O contopire nu trebuie să mute elemente: adaugi greutatea mărgelei de la capăt la vecina ei spre interior și avansezi pointerul — mărgeaua veche pur și simplu nu mai face parte din zonă."
  - "Nu e nevoie să memorezi tot șiragul final: el este jumătatea stângă (perechile egale, în ordinea găsirii), eventual o mărgea din mijloc, apoi aceeași jumătate în ordine inversă. Folosește un pointer de scriere în vectorul `jumatate`; numărul de elemente scrise e diferența dintre el și începutul vectorului."
  - "Pseudocod: cât timp st < dr: dacă valorile sunt egale, scrie valoarea în jumătate, avansează st, retrage dr; altfel, dacă valoarea de la st e mai mică: adun-o la elementul st+1, avansează st, contopiri++; altfel adună valoarea de la dr la elementul dr−1, retrage dr, contopiri++. La final, mijlocul există doar dacă st == dr."
pitfalls:
  - "`*st++ += x` și `(*st)++` fac lucruri foarte diferite de „adaugă la vecin și avansează”; scrie operațiile separat până ești sigur de precedență."
  - "La afișarea inversă, un pointer care coboară până la `jumatate - 1` iese înaintea vectorului (comportament nedefinit); oprește bucla la `p > jumatate` și afișează elementul `p - 1`."
  - "Când doar două mărgele diferite rămân în zonă, contopirea le unește într-una singură: aceasta devine mijlocul (cazul `st == dr`), nu trebuie tratat separat."
