id: lab05-p18-statistici-ordine
lab: lab05
number: 18
title: "Al k-lea timp de răspuns"
difficulty: 4
estimated_minutes: 50
concepts: [pointer la pointer, interschimbare prin pointeri, aritmetică cu pointeri, parametru de tip pointer, indirectare]
statement: |
  Un server a înregistrat `n` timpi de răspuns (întregi, pot fi și negativi după o corecție de ceas). Echipa de monitorizare pune `q` întrebări de forma „care este al `k`-lea cel mai mic timp?” (de exemplu, `k = (n + 1) / 2` dă mediana). Pentru fiecare întrebare afișați valoarea respectivă și de câte ori apare ea printre cei `n` timpi.

  Rezolvați fiecare întrebare prin **selecție rapidă** (quickselect), fără a sorta vectorul. Piesa de bază este partiționarea în trei zone:

  ```c
  void partitie3(int *st, int *sf, int pivot, int **egal_st, int **egal_sf);
  int k_minim(int *st, int *sf, int k, int *aparitii);
  ```

  - `partitie3` rearanjează zona `[st, sf)` astfel încât să conțină întâi elementele `< pivot`, apoi cele `== pivot`, apoi cele `> pivot`, printr-o singură parcurgere, doar cu interschimbări; la adresele `egal_st` și `egal_sf` scrie începutul zonei egale și adresa de după ea;
  - `k_minim` alege ca pivot elementul din **mijlocul** zonei curente (`*(st + (sf - st) / 2)`), partiționează și continuă doar în zona în care se află al `k`-lea element, până când acesta cade în zona egală. Returnează valoarea și scrie la `aparitii` lungimea zonei egale finale.

  Vectorul poate rămâne rearanjat de la o întrebare la alta (valorile, deci și răspunsurile, nu se schimbă).

  **Date de intrare**

  Pe prima linie `n`, pe a doua `n` întregi. Pe a treia linie `q`, apoi `q` linii cu câte un `k`.

  **Date de ieșire**

  Pentru fiecare întrebare, o linie `valoare aparitii`.

  **Restricții**

  - `1 ≤ n ≤ 200000`, `1 ≤ q ≤ 300`, `1 ≤ k ≤ n`
  - valorile sunt întregi din `[-10^9, 10^9]`

  **Exemplu**

  Intrare:
  ```
  9
  12 5 -3 12 8 5 5 20 0
  5
  1
  5
  4
  9
  7
  ```

  Ieșire:
  ```
  -3 1
  5 3
  5 3
  20 1
  12 2
  ```

  Explicație: sortat, vectorul ar fi `-3 0 5 5 5 8 12 12 20`; al 5-lea element este `5`, care apare de 3 ori.
