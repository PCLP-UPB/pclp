hints:
  - "`partitie3` produce două adrese; ca să le transmită apelantului primește adresele a doi pointeri din `k_minim` (pointeri la pointeri). Diferențele `egal_st - st` și `egal_sf - st` spun câte elemente sunt mai mici decât pivotul, respectiv cel mult egale cu el."
  - "Partiționarea „steagului olandez”: trei pointeri `mic`, `cur`, `mare`. Zona `[st, mic)` are elemente mai mici, `[mic, cur)` egale, `[cur, mare)` neexaminate, `[mare, sf)` mai mari. Elementul de la `cur` merge într-una din zone printr-o interschimbare; când `cur` ajunge la `mare`, ai terminat."
  - "Pseudocod k_minim: repetă: pivot = elementul din mijlocul lui [st, sf); partitie3; dacă k ≤ egal_st − st atunci sf = egal_st; altfel dacă k > egal_sf − st atunci k −= egal_sf − st și st = egal_sf; altfel aparitii = egal_sf − egal_st și returnează pivot. Toate aparițiile valorii căutate sunt în zona egală finală, pentru că la fiecare pas ele rămân împreună în zona în care continui."
pitfalls:
  - "Pivotul trebuie copiat într-o variabilă înainte de partiționare: dacă păstrezi doar adresa lui, valoarea de acolo se schimbă după primele interschimbări."
  - "Când elementul de la `cur` este mai mare decât pivotul, după interschimbarea cu `mare - 1` **nu** avansezi `cur`: elementul adus acolo nu a fost încă examinat."
  - "Partiționarea în două zone (fără zona egală) poate intra în buclă infinită când toate valorile sunt egale (vezi testele cu multe duplicate)."
