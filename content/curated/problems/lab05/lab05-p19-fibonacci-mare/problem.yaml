hints:
  - "La fiecare pas ai nevoie doar de ultimele două numere și de un loc pentru rezultat. În loc să copiezi cifre, mută „etichetele”: după calcul, vechiul `cur` devine `ant`, `urm` devine `cur`, iar vechiul `ant` (de care nu mai ai nevoie) devine spațiul liber pentru pasul următor. Pentru asta trebuie interschimbați pointeri — deci `schimba` primește adresele lor."
  - "Adunarea în ordine inversă: parcurgi pozițiile de la 0 la max(na, nb) − 1, aduni cifrele existente plus transportul, scrii `s % 10`, transportul devine `s / 10`; la final, dacă a rămas transport, mai scrii o cifră. Numărul de cifre ține-l în variabile separate, pe care le rotești odată cu pointerii."
  - "Pseudocod pas: l_urm = aduna(ant, l_ant, cur, l_cur, urm); schimba(&ant, &cur); schimbă și l_ant cu l_cur; schimba(&cur, &urm); schimbă și l_cur cu l_urm. Afișarea: de la cifra de indice l_cur − 1 în jos. Tratează separat n = 0 (răspunsul e în ant)."
pitfalls:
  - "Dacă rotești pointerii dar uiți să rotești și lungimile, numerele se afișează cu cifre lipsă sau cu resturi din pașii vechi."
  - "`int *aux = x; x = y; y = aux;` în interiorul unei funcții cu parametri `int *` nu schimbă nimic în `main`; e nevoie de `int **` și de `*x`, `*y`."
  - "La afișarea în ordine inversă cu un pointer, nu coborî sub începutul vectorului; oprește-te la primul element."
