id: lab05-p19-fibonacci-mare
lab: lab05
number: 19
title: "Fibonacci cu o mie de cifre"
difficulty: 4
estimated_minutes: 50
concepts: [pointer la pointer, interschimbare prin pointeri, aritmetică cu pointeri, const, echivalența dintre vector și pointer]
statement: |
  Șirul lui Fibonacci este `F(0) = 0`, `F(1) = 1`, `F(k) = F(k-1) + F(k-2)`. Deja `F(94)` nu mai încape în `unsigned long long`, iar `F(5000)` are 1045 de cifre. Pentru fiecare dintre cele `q` valori `n` citite, afișați `F(n)` complet, numărul lui de cifre și suma cifrelor.

  Un număr mare se memorează ca vector de cifre, **în ordine inversă** (`a[0]` este cifra unităților), împreună cu numărul de cifre. Implementați și folosiți:

  ```c
  int aduna(const int *a, int na, const int *b, int nb, int *rez);   /* rez = a + b; returneaza nr. de cifre */
  void schimba(int **x, int **y);                                     /* interschimba doi pointeri */
  ```

  Calculul folosește **exact trei** vectori de cifre (de exemplu `int buf[3][1100]`) și trei pointeri `ant`, `cur`, `urm` care indică în ei. După ce `urm = ant + cur` este calculat, cei trei pointeri își schimbă rolurile prin `schimba` — **nu se copiază nicio cifră** dintr-un vector în altul.

  **Date de intrare**

  Pe prima linie `q`, apoi `q` linii cu câte un `n`.

  **Date de ieșire**

  Pentru fiecare `n`, două linii:

  ```
  F(n) = <cifrele lui F(n), fara zerouri la inceput>
  <c> cifre, suma cifrelor <s>
  ```

  **Restricții**

  - `1 ≤ q ≤ 10`, `0 ≤ n ≤ 5000`

  **Exemplu**

  Intrare:
  ```
  3
  10
  1
  100
  ```

  Ieșire:
  ```
  F(10) = 55
  2 cifre, suma cifrelor 10
  F(1) = 1
  1 cifre, suma cifrelor 1
  F(100) = 354224848179261915075
  21 cifre, suma cifrelor 93
  ```
