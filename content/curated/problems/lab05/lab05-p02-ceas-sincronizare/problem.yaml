  int main(void)
  {
      int h, m, s, q, i, delta;

      scanf("%d %d %d", &h, &m, &s);
      scanf("%d", &q);
      for (i = 0; i < q; i++) {
          scanf("%d", &delta);
          /* TODO: apel ajusteaza + afisare cu %02d */
      }

      return 0;
  }
hints:
  - "Funcția trebuie să modifice trei variabile din `main`, deci primește adresele lor. În interiorul ei lucrezi cu `*h`, `*m`, `*s`."
  - "E mai simplu să transformi ora în „secunde de la miezul nopții” (un singur număr între 0 și 86399), să aduni corecția modulo 86400 și apoi să refaci ora, minutul și secunda."
  - "Pseudocod: total = h*3600 + m*60 + s; total = (total + delta % 86400) % 86400; dacă total < 0 atunci total += 86400; h = total / 3600; m = (total % 3600) / 60; s = total % 60."
pitfalls:
  - "În C, restul împărțirii unui număr negativ este negativ (`-1 % 86400 == -1`) — corectează-l adunând 86400."
  - "O buclă care adaugă câte o secundă sau câte o zi este mult prea lentă pentru `delta = 10^9`."
