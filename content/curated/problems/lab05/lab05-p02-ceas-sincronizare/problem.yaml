id: lab05-p02-ceas-sincronizare
lab: lab05
number: 2
title: "Sincronizarea ceasului"
difficulty: 1
estimated_minutes: 20
concepts: [pointer, parametru de tip pointer, operatorul de referențiere, operatorul de dereferențiere, funcție]
statement: |
  Un ceas digital afișează ora în format `HH:MM:SS`. Serverul de timp îi trimite, pe rând, `q` corecții: fiecare corecție este un număr întreg de secunde (pozitiv = ceasul trebuie dat înainte, negativ = înapoi). După fiecare corecție afișați ora indicată de ceas. Ceasul este circular: după `23:59:59` urmează `00:00:00`, iar înainte de `00:00:00` este `23:59:59`.

  Implementați și folosiți funcția:

  ```c
  void ajusteaza(int *h, int *m, int *s, int delta);
  ```

  care modifică ora, minutul și secunda direct, prin pointeri.

  **Date de intrare**

  Pe prima linie: ora inițială, ca trei numere `h m s`. Pe a doua linie: `q`, numărul de corecții. Urmează `q` linii, fiecare cu un întreg `delta`.

  **Date de ieșire**

  `q` linii; linia `i` conține ora după aplicarea primelor `i` corecții, în format `HH:MM:SS` (fiecare componentă pe exact două cifre).

  **Restricții**

  - `0 ≤ h ≤ 23`, `0 ≤ m, s ≤ 59`
  - `1 ≤ q ≤ 1000`
  - `-10^9 ≤ delta ≤ 10^9`

  **Exemplu**

  Intrare:
  ```
  23 58 30
  4
  45
  60
  -120
  86400
  ```

  Ieșire:
  ```
  23:59:15
  00:00:15
  23:58:15
  23:58:15
  ```
