hints:
  - "Funcția de ordonare trebuie să modifice trei variabile ale apelantului, deci primește adresele lor. `interschimba` este piesa de bază: o poți apela din `ordoneaza3` cu pointerii primiți, fără `&` în plus."
  - "Trei comparații sunt suficiente: pune maximul dintre primele două pe poziția a doua, apoi maximul dintre ultimele două pe poziția a treia, apoi mai compară o dată primele două. Linia `dim[i]` este un vector de 3 întregi, deci se transmite ca pointer la primul element."
  - "Pseudocod pentru incape(d1, d2): pentru k de la 0 la 2 (avansând ambii pointeri): dacă valoarea de la d1 ≥ valoarea de la d2 returnează 0; la final returnează 1. Atenție la inegalitatea strictă și la cazul a = b."
pitfalls:
  - "`interschimba(*a, *b)` trimite valorile, nu adresele — funcția ar interschimba copii locale (și compilatorul dă warning)."
  - "Dacă ordonezi dimensiunile doar în copii locale din funcție, `dim` rămâne neordonat și comparația din `incape` e greșită."
  - "Cu `<=` în loc de `<`, cutiile egale ar „intra” una în alta."
