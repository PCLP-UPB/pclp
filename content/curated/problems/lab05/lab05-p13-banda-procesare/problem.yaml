hints:
  - "Numele unei funcții scris fără paranteze este adresa ei. Poți pune adresele celor cinci transformări într-un vector și apela direct elementul de indice `c - 1`."
  - "`aplica` și `reduce` nu știu ce operație fac: primesc funcția ca parametru și doar o apelează. Toată logica specifică stă în funcțiile mici (dublare, minim, cmmdc...)."
  - "Pseudocod reduce: acc = valoarea de la v; pentru p de la v+1 până înainte de v+n: acc = op(acc, valoarea de la p); returnează acc. Pentru comanda citește tipul cu un spațiu în format, ca să sari peste sfârșitul de linie."
pitfalls:
  - "`aplica(v, n, dublare())` apelează funcția (fără argumente) în loc să-i trimită adresa — trebuie `dublare`, fără paranteze."
  - "`int *f(int)` declară o funcție care returnează pointer; pointerul la funcție are nevoie de paranteze: `int (*f)(int)`."
  - "Ultima cifră a unui număr negativ: `-37 % 10` este `-7` în C; ia întâi valoarea absolută."
  - "`scanf(\"%c\", ...)` fără spațiu înainte citește caracterul `\\n` rămas de la linia anterioară."
