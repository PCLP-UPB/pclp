id: lab05-p13-banda-procesare
lab: lab05
number: 13
title: "Banda de procesare"
difficulty: 2
estimated_minutes: 35
concepts: [pointer la funcție, numele funcției ca pointer, aritmetică cu pointeri, const, funcție]
statement: |
  Un senzor produce `n` valori întregi, care trec printr-o „bandă de procesare” programabilă. Banda execută, în ordine, `q` comenzi:

  | comandă | efect |
  |---|---|
  | `M c` | transformă **fiecare** valoare `x` cu transformarea de cod `c` |
  | `R c` | afișează rezultatul reducerii de cod `c` aplicate valorilor curente |
  | `P` | afișează valorile curente, separate prin câte un spațiu |

  Transformări (`M`): `1` — dublare (`2x`); `2` — negare (`-x`); `3` — valoarea absolută; `4` — ultima cifră a lui `|x|`; `5` — incrementare (`x + 1`).

  Reduceri (`R`): `1` — suma; `2` — minimul; `3` — maximul; `4` — cel mai mare divizor comun al valorilor absolute (cu `cmmdc(0, x) = |x|`, deci cmmdc-ul unor valori toate nule este 0).

  Implementați câte o funcție scurtă pentru fiecare transformare (`int f(int x)`) și pentru fiecare reducere (`int op(int acumulator, int x)`), plus două funcții generice:

  ```c
  void aplica(int *v, int n, int (*f)(int));                /* v[i] = f(v[i]) pentru toti i */
  int reduce(const int *v, int n, int (*op)(int, int));     /* acc = v[0]; acc = op(acc, v[i]) pentru i = 1..n-1 */
  ```

  Funcțiile se aleg după cod din doi **vectori de pointeri la funcții** (fără `switch` sau `if` pe cod). În `aplica` și `reduce` parcurgeți vectorul cu un pointer, nu cu indici.

  **Date de intrare**

  Pe prima linie `n`, pe a doua `n` întregi. Pe a treia linie `q`, apoi `q` linii cu câte o comandă.

  **Date de ieșire**

  Câte o linie pentru fiecare comandă `R` sau `P`, în ordinea comenzilor.

  **Restricții**

  - `1 ≤ n ≤ 1000`, `1 ≤ q ≤ 30`, valorile inițiale sunt din `[-1000, 1000]`
  - cel mult 10 comenzi sunt `M 1`, deci toate valorile și sumele încap în `int`

  **Exemplu**

  Intrare:
  ```
  5
  3 -4 7 0 -12
  8
  P
  R 1
  M 3
  R 4
  M 1
  M 5
  P
  R 2
  ```

  Ieșire:
  ```
  3 -4 7 0 -12
  -6
  1
  7 9 15 1 25
  1
  ```

  Explicație: după `M 3` valorile sunt `3 4 7 0 12` (cmmdc 1); după `M 1` și `M 5` devin `7 9 15 1 25`.
