hints:
  - "O rotire cu `n` poziții lasă vectorul neschimbat, deci contează doar `k % n`. O rotire la dreapta cu `|k|` este o rotire la stânga cu `n - |k|`."
  - "Pentru inversare folosește doi pointeri, unul la început și unul la sfârșit, care se apropie unul de altul și interschimbă valorile. O rotire se poate obține din trei inversări."
  - "Pseudocod: k = k mod n (adus în [0, n)); inverseaza(v, v+k-1); inverseaza(v+k, v+n-1); inverseaza(v, v+n-1). Verifică pe hârtie cu 1 2 3 4 5 și k = 2."
pitfalls:
  - "Sfârșitul unui segment de `k` elemente care începe la `v` este `v + k - 1`, nu `v + k`."
  - "`k % n` poate fi negativ pentru `k < 0`; adaugă `n` în acest caz."
