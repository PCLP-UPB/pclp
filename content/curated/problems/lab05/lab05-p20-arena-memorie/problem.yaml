hints:
  - "Ține două vederi ale aceleiași memorii: vectorul `proprietar` (primit de `prima_potrivire` ca parametrul `ocupat`: cine deține fiecare celulă, util pentru căutarea zonelor libere și pentru hartă) și pointerii `bloc[id]` (unde începe fiecare bloc, util pentru citire/scriere). Orice operație care schimbă una trebuie să o actualizeze și pe cealaltă."
  - "Prima potrivire: parcurge vectorul de proprietari și numără celulele libere consecutive; în momentul în care numărul ajunge la `len`, zona începe cu `len − 1` celule în urmă. Harta și compactarea parcurg arena de la stânga: la o celulă ocupată de `id`, știi că acolo începe blocul `id` și poți sări direct `lung[id]` celule."
  - "Pseudocod compactare: dest = arena; pentru fiecare început de bloc întâlnit de la stânga la dreapta: muta_stanga(dest, bloc[id], lung[id]); bloc[id] = dest; marchează în proprietar celulele [dest, dest + lung) cu id; dest += lung. La final marchează ca libere celulele de la dest până la sfârșitul arenei. Copierea de la stânga la dreapta e corectă pentru că destinația nu e niciodată după sursă."
pitfalls:
  - "După `F`, dacă nu pui `bloc[id] = NULL`, un `R` ulterior citește dintr-o zonă care poate aparține deja altui bloc — exact problema unui *dangling pointer*."
  - "Dacă la compactare copiezi datele dar uiți să actualizezi `bloc[id]`, pointerul indică vechea poziție; testele care citesc după `C` o detectează."
  - "`k = -1` sau `k = len` trebuie respinse: `bloc[id] - 1` și `bloc[id] + len` sunt în afara blocului (poate chiar în afara arenei)."
  - "Căutarea primei zone libere trebuie să caute zone de celule consecutive, nu doar să numere celulele libere totale."
