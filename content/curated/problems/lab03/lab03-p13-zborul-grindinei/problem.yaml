hints:
  - "Ambele funcții au aceeași structură: cazul de bază este n = 1, iar în rest problema pentru n se reduce la aceeași problemă pentru termenul următor din șir."
  - "Scrie o funcție ajutătoare care întoarce termenul următor. Atunci pasi(n) = 1 + pasi(urmator(n)), iar varf(n) = maximul dintre n și varf(urmator(n))."
  - "În main: parcurge n de la a la b, păstrează cel mai mare număr de pași găsit și numărul care l-a dat; actualizează doar la „strict mai mare”, ca la egalitate să rămână numărul mai mic. Calculează vârful doar pentru câștigător."
pitfalls:
  - "3n + 1 depășește int pentru multe numere de start sub 10^7 (vârfuri de ordinul 10^10): parametrii și rezultatul lui varf trebuie să fie long long."
  - "Fără cazul de bază (sau cu un caz de bază greșit, de exemplu n == 0), recursivitatea nu se oprește și programul se termină cu stack overflow."
