  }

  int main(void)
  {
  	/* TODO: citește n comenzi; pentru fiecare, un switch după literă */
  	return 0;
  }
hints:
  - "O variabilă locală declarată static nu dispare la ieșirea din funcție: la următorul apel are valoarea lăsată de apelul anterior. Este inițializată o singură dată (implicit cu 0)."
  - "Cum afli stocul fără să-l modifici? Apelează stoc cu delta = 0. La fel, bonuri(0) doar raportează."
  - "Pentru C x: dacă x ≤ stoc(0), apelezi stoc(-x) și afișezi numărul întors de bonuri(1), altfel afișezi refuzul cu stoc(0). Citește litera comenzii cu \" %c\", iar numărul doar pentru A și C."
pitfalls:
  - "Fără static, variabila este re-creată la fiecare apel și stocul pare mereu gol."
  - "O comandă refuzată nu consumă un număr de bon."
