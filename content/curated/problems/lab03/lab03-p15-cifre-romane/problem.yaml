hints:
  - "Nu ai nevoie de șiruri de caractere: citește primul caracter nenul cu scanf(\" %c\"), decide după el tipul elementului, apoi citește restul caracter cu caracter cu getchar, până la primul caracter care nu mai face parte din număr (de exemplu, '\\n')."
  - "Arab → roman: cifra sutelor se scrie exact ca cifra unităților, doar cu alte trei litere (C, D, M în loc de I, V, X). De aceea o singură funcție parametrizată cu literele ajunge pentru toate ordinele: 9 → unu zece, 4 → unu cinci, altfel (cinci dacă cifra ≥ 5) urmat de unu repetat de (cifra mod 5) ori."
  - "Roman → arab, fără să te uiți înainte: adună valoarea fiecărei litere; dacă litera curentă e mai mare decât precedenta, înseamnă că precedenta trebuia scăzută, nu adunată, deci scade de două ori valoarea precedentei. Exemplu: MCM → 1000, apoi +100, apoi +1000 − 2·100 = 1900."
pitfalls:
  - "Caracterul de după număr (newline) e consumat de getchar; asta e în regulă, pentru că următorul scanf(\" %c\") sare oricum peste spații albe."
