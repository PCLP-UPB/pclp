hints:
  - "Plata e natural recursivă: a plăti n înseamnă a da cea mai mare monedă m ≤ n și apoi a plăti n − m. Cazul de bază: suma 0 nu mai cere nicio monedă."
  - "Cea mai mare monedă ≤ n se găsește iterativ, cu două variabile consecutive din șir (a, b) avansate cât timp b ≤ n. Pentru cod, mergi în jos pe șir: dacă știi doi termeni consecutivi (x, anterior), perechea următoare în jos este (anterior, x − anterior)."
  - "Cod: scrie_cod(n, x, anterior): dacă x ≤ n, afișează 1 și scade x din n, altfel afișează 0; dacă x == 1 te oprești, altfel apelezi scrie_cod(n, anterior, x − anterior). Pornești cu x = cea mai mare monedă ≤ n, iar anterior = cea mai mare monedă ≤ x − 1."
pitfalls:
  - "Sumele ajung la 10^18: tot ce ține de sume și monede trebuie să fie long long (și %lld)."
  - "Șirul monedelor începe cu 1, 2 (nu cu 1, 1): altfel codul ar avea o cifră în plus."
