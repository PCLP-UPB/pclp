id: lab03-p05-prime-gemene
lab: lab03
number: 5
title: "Numere prime gemene"
difficulty: 2
estimated_minutes: 25
concepts: [funcție, număr prim, return, operator logic]
statement: |
  Două numere prime se numesc **gemene** dacă diferența dintre ele este 2, de exemplu
  (11, 13) sau (17, 19). Scrie funcția `int este_prim(int n)`, care întoarce 1 dacă `n`
  este prim și 0 altfel, și folosește-o pentru a afișa toate perechile de numere prime
  gemene `(p, p + 2)` cu **ambele** numere în intervalul `[a, b]`.

  Funcția trebuie să fie eficientă: nu testa divizori mai mari decât `√n`.

  **Date de intrare**

  Pe o linie, două numere naturale `a b`.

  **Date de ieșire**

  Câte o linie `(p, q)` pentru fiecare pereche găsită, în ordine crescătoare, apoi linia
  `Perechi: N`, unde `N` este numărul de perechi.

  **Restricții**

  - `1 ≤ a ≤ b ≤ 100 000`

  **Exemplu**

  Intrare:
  ```
  1 50
  ```

  Ieșire:
  ```
  (3, 5)
  (5, 7)
  (11, 13)
  (17, 19)
  (29, 31)
  (41, 43)
  Perechi: 6
  ```
