hints:
  - "Un divizor d > √n al lui n are pereche divizorul n / d < √n, deci ajunge să cauți până la √n. Ai grijă la cazurile mici: 0, 1, 2."
  - "În main, parcurge toate valorile p pentru care p și p + 2 sunt în interval și verifică ambele cu funcția ta."
  - "Condiția de oprire a buclei de divizori poate fi scrisă fără sqrt: d * d <= n. După ce ai tratat numerele pare, e suficient să încerci divizori impari."
pitfalls:
  - "1 nu este număr prim."
  - "Perechea trebuie să fie complet în interval: pentru [3, 4], (3, 5) nu se numără."
