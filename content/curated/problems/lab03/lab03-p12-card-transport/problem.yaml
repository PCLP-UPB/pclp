hints:
  - "Cifrele de la dreapta la stânga se obțin cu numar % 10 și numar / 10, repetat. Ține minte, cu o variabilă care alternează între 0 și 1, dacă cifra curentă se dublează."
  - "Pentru cifra de control ai două variante: încerci pe rând c = 0..9 și verifici cu este_valid(fara_control * 10 + c), sau calculezi suma direct pe fara_control, știind că acum cifra lui cea mai din dreapta este cea care se dublează."
  - "Cu suma S (calculată fără cifra de control, cu dublarea începând de la ultima cifră), cifra căutată este (10 - S % 10) % 10. Al doilea % 10 tratează cazul S multiplu de 10, când cifra corectă este 0."
pitfalls:
  - "Dublarea începe de la a doua cifră din dreapta, nu de la prima cifră din stânga: pentru numere cu lungimi diferite, cele două convenții dau rezultate diferite."
  - "Numerele au până la 18 cifre: ai nevoie de long long și de %lld."
