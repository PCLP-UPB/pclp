hints:
  - "Starea trebuie să supraviețuiască între apeluri și să fie comună mai multor funcții (seteaza_samanta o scrie, urmatorul o citește și o scrie): de aceea e o variabilă globală. Cuvântul static în fața ei o ascunde de alte fișiere sursă."
  - "Toate zarurile trec prin urmatorul(), deci contorul se incrementează într-un singur loc. Pentru rundă, o variabilă static declarată în duel() e inițializată o singură dată (cu 0) și își păstrează valoarea de la un apel la altul."
  - "Verifică tipurile: x < 2^31 și multiplicatorul ≈ 1.1 · 10^9, deci produsul are până la ~62 de biți; calculează-l în long long (2^31 scris ca 2147483648LL). În duel, aruncă întâi toate cele 4 zaruri în variabile, în ordinea din enunț, și abia apoi afișează."
pitfalls:
  - "Apelurile zar() direct ca argumente ale lui printf nu au o ordine de evaluare garantată: zarurile Anei și ale lui Bogdan pot ieși amestecate. Salvează-le întâi în variabile."
  - "Un int x = 0; obișnuit în duel() ar reporni numărătoarea rundelor la fiecare apel."
