hints:
  - "Soluția are trei etape: 2^(n−1) − 1 mutări pentru turnul mic, o mutare pentru discul n, apoi alte 2^(n−1) − 1 mutări. Comparând k cu 2^(n−1) afli în ce etapă a ajuns robotul și unde este discul n."
  - "Dacă k < 2^(n−1), discul n e încă pe sursă, iar robotul lucrează la subproblema «n − 1 discuri de pe sursă pe aux» (rolurile tijelor se schimbă!). Altfel, discul n e pe destinație, iar robotul a făcut 2^(n−1) mutări și lucrează la «n − 1 discuri de pe aux pe destinație», cu k − 2^(n−1) mutări deja făcute acolo."
  - "Funcția tija_discului coboară astfel până ajunge la n = d. Pentru următoarea mutare: dacă k = 2^(n−1) − 1, urmează chiar mutarea discului n de pe sursă pe destinație; altfel coborî în etapa corespunzătoare. Pentru puteri mari folosește 1LL << (n − 1)."
pitfalls:
  - "1 << 40 este calculat în int și produce overflow; ai nevoie de 1LL."
  - "În apelurile recursive, tijele își schimbă rolurile; verifică pe hârtie pentru n = 2."
