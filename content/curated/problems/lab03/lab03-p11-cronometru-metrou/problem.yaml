hints:
  - "Lucrează cu un singur număr pe moment, nu cu trei: transformă fiecare oră în secunde de la miezul nopții, calculează diferența și abia la afișare revino la ore, minute și secunde."
  - "Dacă sosirea (în secunde) e mai mică decât plecarea, călătoria a trecut de miezul nopții: durata este timpul rămas până la 24:00:00 plus timpul de după miezul nopții."
  - "Pentru afișare: ore = t / 3600, minute = (t / 60) % 60, secunde = t % 60, fiecare cu specificatorul %02d. Adună duratele într-un total pe care îl afișezi cu aceeași funcție."
pitfalls:
  - "Momente egale înseamnă durata 0, nu 24 de ore: testul corect pentru miezul nopții este sosire < plecare, nu sosire <= plecare."
  - "La total, orele nu se iau modulo 24."
