hints:
  - "Fiecare funcție primește un double și întoarce un double calculat cu formula dată."
  - "Scrie constantele ca numere reale (9.0 / 5.0). Între întregi, 9 / 5 este 1."
  - "În main, citește scala cu \" %c\" (cu spațiu în față), apoi valoarea cu %lf. Pentru maxim, transformă întâi fiecare valoare în Celsius și compară doar valori în Celsius."
pitfalls:
