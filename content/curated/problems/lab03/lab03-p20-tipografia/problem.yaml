id: lab03-p20-tipografia
lab: lab03
number: 20
title: "Tipografia"
difficulty: 5
estimated_minutes: 75
concepts: [recursivitate, funcție, long long, overflow, împărțire întreagă, operatorul modulo]
statement: |
  O tipografie numerotează paginile cărților de la 1 la `N` și are două întrebări frecvente:

  - **`C N c`** — de câte ori apare cifra `c` în numerele paginilor 1, 2, ..., `N`? (de exemplu,
    pentru `N = 12` și `c = 1`: o dată în 1, 10 și 12, de două ori în 11, deci de 5 ori);
  - **`T D`** — pentru numerotarea unei cărți s-au folosit în total exact `D` cifre; câte pagini
    are cartea? (de exemplu, `D = 15`: paginile 1–9 folosesc 9 cifre, iar 10, 11, 12 încă 6, deci
    12 pagini). Dacă nicio carte nu folosește exact `D` cifre, răspunsul este `IMPOSIBIL`.

  Cărțile (și `N`) pot fi uriașe, până la `10^18`, deci nu poți parcurge paginile una câte una.
  Pentru întrebarea `C`, scrie o funcție **recursivă**
  `long long aparitii(long long n, int c, long long p)`, care numără aparițiile cifrei `c` pe
  poziția de valoare `p` (unități pentru `p = 1`, zeci pentru `p = 10`, ...) și pe toate
  pozițiile mai mari, în numerele de la 1 la `n`.

  Numerele se scriu fără zerouri în față (pagina 7 nu este „07”).

  **Date de intrare**

  Pe prima linie, `q`. Pe următoarele `q` linii, câte o întrebare, `C N c` sau `T D`.

  **Date de ieșire**

  Câte o linie pentru fiecare întrebare: numărul cerut sau `IMPOSIBIL`.

  **Restricții**

  - `1 ≤ q ≤ 1000`
  - `1 ≤ N ≤ 10^18`, `0 ≤ c ≤ 9`, `1 ≤ D ≤ 10^18`
  - toate rezultatele încap în `long long`

  **Exemplu**

  Intrare:
  ```
  5
  C 12 1
  C 100 0
  T 15
  T 16
  C 1000000000000000000 1
  ```

  Ieșire:
  ```
  5
  11
  12
  IMPOSIBIL
  1800000000000000001
  ```
