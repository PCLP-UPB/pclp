hints:
  - "Numără pe poziții, nu pe numere: pe poziția unităților, cifra c apare o dată la fiecare 10 numere consecutive; pe poziția zecilor, apare în blocuri de câte 10 numere o dată la fiecare 100 de numere; în general, pe poziția p apare în blocuri de câte p numere, o dată la fiecare 10 · p numere."
  - "Pentru poziția p, desparte n în trei părți: sus = n / (10p), cur = cifra de pe poziția p = (n / p) mod 10, jos = n mod p. Dacă c ≠ 0: cifra c apare de sus · p ori în blocurile complete, plus p dacă cur > c, sau jos + 1 dacă cur = c. Pentru c = 0 ai grijă: partea de sus nu poate fi 0 (ar însemna zerouri în față), deci blocurile complete sunt doar sus − 1, și nu există nimic dacă sus = 0."
  - "Pentru T, ia pe rând lungimile L = 1, 2, 3, ...: există 9 · 10^(L−1) pagini cu L cifre, care folosesc L · 9 · 10^(L−1) cifre. Scade grupurile întregi cât timp D e mai mare; în ultimul grup, D trebuie să se împartă exact la L, iar numărul de pagini este 10^(L−1) − 1 + D / L. Atenție la depășiri: nu calcula 10 · p dacă p > n / 10."
pitfalls:
  - "Pentru N = 10^18, 10 · p poate ajunge la 10^19, care depășește long long: oprește recursivitatea înainte să calculezi o putere a lui 10 mai mare decât n."
  - "Cifra 0 are regula ei: fără tratarea separată, ai număra zerourile din fața numerelor mai scurte."
