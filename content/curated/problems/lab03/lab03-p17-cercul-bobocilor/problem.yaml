id: lab03-p17-cercul-bobocilor
lab: lab03
number: 17
title: "Jocul din cercul bobocilor"
difficulty: 3
estimated_minutes: 45
concepts: [recursivitate, condiție de oprire, funcție, operatorul modulo, abordare iterativă]
statement: |
  La balul bobocilor, `n` studenți stau în cerc, numerotați de la 1 la `n` în sensul acelor de
  ceasornic. Prezentatorul numără de la 1 la `k`, începând cu studentul 1; cel la care ajunge
  numărul `k` iese din cerc, iar numărătoarea reîncepe de la 1 cu următorul student rămas.
  Ultimul rămas câștigă premiul cel mare, iar cel care iese când mai sunt doar doi primește
  premiul de consolare.

  De exemplu, pentru `n = 7`, `k = 3` ies, în ordine, 3, 6, 2, 7, 5, 1 și câștigă 4; premiul de
  consolare îl ia studentul 1.

  Cu `n` de până la 30 000 și `k` de până la un miliard, simularea directă e prea lentă și ar
  cere un vector. Există însă o relație simplă între răspunsul pentru `m` studenți și cel
  pentru `m − 1` studenți. Găsește-o și scrie funcțiile **recursive**
  `int castigator(int m, int k)` și `int ultimul_eliminat(int m, int k)`.

  **Date de intrare**

  Pe prima linie, `q`. Pe fiecare dintre următoarele `q` linii, două numere `n k`.

  **Date de ieșire**

  Pentru fiecare pereche, o linie cu două numere: câștigătorul și studentul care primește premiul
  de consolare.

  **Restricții**

  - `1 ≤ q ≤ 100`
  - `2 ≤ n ≤ 30 000`, `1 ≤ k ≤ 10^9`

  **Exemplu**

  Intrare:
  ```
  3
  7 3
  5 2
  6 1
  ```

  Ieșire:
  ```
  4 1
  3 5
  6 5
  ```
