hints:
  - "Lucrează cu poziții numerotate de la 0 și adaugă 1 doar la afișare: formulele cu modulo devin mult mai simple. Pentru un singur student, câștigătorul e cel de pe poziția 0."
  - "După prima eliminare, rămân m − 1 studenți și numărătoarea reîncepe cu cel de după cel eliminat, adică de la poziția k mod m. Deci jocul rămas este un joc cu m − 1 studenți, doar că „renumerotat”: poziția p din jocul mic corespunde poziției (p + k) mod m din jocul mare."
  - "castigator(m) = (castigator(m − 1) + k) mod m, cu castigator(1) = 0. Premiul de consolare urmează exact aceeași relație, doar cazul de bază se schimbă: în cercul de doi (pozițiile 0 și 1), cu numărătoarea pornită de la 0, iese (k − 1) mod 2."
pitfalls:
  - "k poate fi mult mai mare decât n: nu simula numărătoarea pas cu pas, iar în formule folosește modulo."
  - "Adâncimea recursivității este n (până la 30 000 de apeluri imbricate), ceea ce e încă în regulă; varianta iterativă (un for de la 2 la n) evită complet problema."
