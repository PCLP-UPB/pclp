hints:
  - "Un cod se construiește cifră cu cifră: după ce ai ales prima cifră c, restul codului este tot un cod (cu o cifră mai puțin), a cărui primă cifră trebuie să fie cel puțin c + d și a cărui sumă trebuie să fie S − c. Asta îți dă recursivitatea pentru numara; cazul de bază e ramase = 0 (există exact un cod gol, dacă suma rămasă e 0)."
  - "Codurile în ordine crescătoare sunt grupate după prima cifră: întâi toate cele care încep cu cea mai mică cifră posibilă, apoi cele cu următoarea etc. Dacă știi câte coduri sunt în fiecare grup (cu numara), poți afla în ce grup cade al p-lea cod fără să le generezi pe toate."
  - "afiseaza_codul: pentru c de la minim la 9, calculează cate = numara(ramase − 1, c + pas, pas, suma − c). Dacă p ≤ cate, afișează c și continuă recursiv cu (ramase − 1, c + pas, suma − c, p); altfel p = p − cate și încerci următoarea cifră. Pentru viteză, în numara renunță imediat când suma rămasă e negativă sau nu mai poate fi atinsă (de exemplu, 9 · ramase < suma)."
pitfalls:
  - "Codurile pot începe cu 0 (de exemplu 039): afișează cifrele una câte una, nu ca un număr întreg cu %d."
  - "Pentru d = 0 sunt permise cifre egale (0011...); nu presupune că cifrele sunt distincte."
