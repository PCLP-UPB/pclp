hints:
  - "O celulă (x, y) cade într-unul din cele 3 × 3 blocuri; indicii blocului sunt ultimele cifre ale lui x și y în baza 3 (x mod 3, y mod 3), iar poziția în interiorul blocului mai mic se obține cu x / 3 și y / 3. Gândește-te la pătratul „mare” din mijloc ca fiind cifrele cele mai semnificative."
  - "Celula e goală dacă, la vreun nivel, cade în blocul din mijloc: atunci x mod 3 = 1 și y mod 3 = 1. Altfel, răspunsul este cel pentru (x / 3, y / 3). Cazul de bază: (0, 0) e plină. Observă că ordinul covorului nici nu mai contează pentru plin."
  - "Pentru o linie r din covorul de ordin k: banda de blocuri în care se află r este r / 3^(k−1). Dacă e banda din mijloc, linia trece prin 2 covoare de ordin k − 1 (blocul din mijloc e gol), altfel prin 3; în fiecare, linia are indicele r mod 3^(k−1). Deci rezultatul e 2 sau 3 ori pline_pe_linie(k − 1, r mod 3^(k−1)), cu cazul de bază k = 0 → 1."
pitfalls:
  - "3^38 ≈ 1,35 · 10^18: coordonatele, puterile lui 3 și numărul de celule pline trebuie să fie long long, iar la puterea lui 3 nu calcula 3^39 (depășește long long)."
  - "Nu încerca să construiești covorul mare: are mai multe celule decât are memoria oricărui calculator."
