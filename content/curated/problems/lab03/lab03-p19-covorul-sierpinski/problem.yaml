id: lab03-p19-covorul-sierpinski
lab: lab03
number: 19
title: "Covorul lui Sierpinski"
difficulty: 4
estimated_minutes: 50
concepts: [recursivitate, condiție de oprire, funcție, long long, buclă imbricată, putchar]
statement: |
  Un magazin de covoare vinde modelul „Sierpinski”, definit recursiv:

  - covorul de **ordin 0** este o singură celulă plină;
  - covorul de **ordin K** (K ≥ 1) are latura `3^K` și se împarte în 3 × 3 blocuri egale, de latură
    `3^(K−1)`: blocul din mijloc este complet gol, iar celelalte opt sunt covoare de ordin `K − 1`.

  Covorul de ordin 2 arată așa (`#` = plin, `.` = gol):

  ```
  #########
  #.##.##.#
  #########
  ###...###
  #.#...#.#
  ###...###
  #########
  #.##.##.#
  #########
  ```

  Liniile și coloanele se numerotează de la 0, de sus în jos și de la stânga la dreapta.

  Programul trebuie mai întâi să **deseneze** covorul de ordin `k`, apoi să răspundă la
  întrebări despre covoare uriașe (până la ordinul 38, cu latura peste `10^18`):

  - `P K x y` — celula de pe linia `x` și coloana `y` a covorului de ordin `K` este plină?
    Răspunsul este `PLIN` sau `GOL`.
  - `R K r` — câte celule pline are linia `r` a covorului de ordin `K`?

  Scrie funcțiile **recursive** `int plin(long long x, long long y)` (folosită atât la desen,
  cât și la întrebări) și `long long pline_pe_linie(int k, long long r)`.

  **Date de intrare**

  Pe prima linie, `k`. Pe a doua, numărul de întrebări `q`. Pe următoarele `q` linii,
  întrebările, în formatul de mai sus.

  **Date de ieșire**

  `3^k` linii cu câte `3^k` caractere (desenul), apoi câte o linie cu răspunsul fiecărei întrebări.

  **Restricții**

  - `0 ≤ k ≤ 4`
  - `1 ≤ q ≤ 1000`, `0 ≤ K ≤ 38`, `0 ≤ x, y, r < 3^K`

  **Exemplu**

  Intrare:
  ```
  2
  5
  P 2 1 1
  P 1 0 2
  R 2 4
  R 2 3
  P 38 1350851717672992088 4
  ```

  Ieșire:
  ```
  #########
  #.##.##.#
  #########
  ###...###
  #.#...#.#
  ###...###
  #########
  #.##.##.#
  #########
  GOL
  PLIN
  4
  6
  PLIN
  ```
