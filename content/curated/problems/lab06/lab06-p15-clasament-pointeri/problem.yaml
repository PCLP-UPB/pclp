hints:
  - "Elementele vectorului de pointeri sunt de tip `int *`, deci se alocă `n * sizeof(int *)` octeți. Scorul indicat de `ordine[i]` este `*ordine[i]`, iar numărul concurentului este `ordine[i] - v + 1`."
  - "Orice sortare simplă merge (`n ≤ 5000`), dar comparația și interschimbarea se fac pe pointeri: compari `*p` cu `*q`, iar la egalitate compari chiar adresele `p < q` (în același vector, adresa mai mică înseamnă înscriere mai devreme). Interschimbi pointerii, nu scorurile."
  - "Locurile: parcurgi `ordine`; dacă scorul de pe poziția `i` e egal cu cel de pe `i - 1`, locul e același ca al precedentului, altfel e `i + 1`. Scrii locul în `loc[ordine[i] - v]`. La final: `free(ordine)` eliberează doar pointerii, nu și scorurile — mai ai nevoie de `free(v)` și `free(loc)`."
pitfalls:
  - "Nu apela `free(ordine[i])`: pointerii indică în interiorul lui `v`, care e un singur bloc alocat."
  - "Dacă interschimbi `*ordine[i]` cu `*ordine[j]` în loc de `ordine[i]` cu `ordine[j]`, modifici vectorul `v`."
  - "Verifică `x` înainte să-l folosești ca indice în `loc`."
