id: lab06-p17-ciur-prime
lab: lab06
number: 17
title: "Ciurul de pe heap"
difficulty: 3
estimated_minutes: 40
concepts: [calloc, malloc, vector alocat dinamic, heap, stivă, eliberarea memoriei alocate dinamic, căutare binară]
statement: |
  La seminarul de criptografie, studenții au nevoie de răspunsuri rapide la întrebări despre numerele prime mai mici sau egale cu un `N` care poate ajunge la zece milioane.

  Programul procedează în doi pași:

  1. Construiește **ciurul lui Eratostene** pentru `1 … N` într-un vector de `N + 1` octeți (`char`) alocat dinamic. Un vector local de 10 milioane de elemente nu încape pe stivă (de obicei 8 MB), de aceea memoria se ia din heap.
  2. Numără numerele prime găsite, alocă un vector de `int` de **exact** atâtea elemente, copiază în el numerele prime (în ordine crescătoare) și **eliberează imediat ciurul** — de aici înainte se lucrează doar cu vectorul de prime.

  Implementați și folosiți:

  ```c
  int *prime_pana_la(int n, int *cnt);              /* vectorul de prime (*cnt elemente) sau NULL la eroare */
  int cate_cel_mult(const int *p, int cnt, int x);  /* cate prime din p sunt <= x */
  ```

  Întrebările sunt de trei tipuri:

  - `P x` — este `x` prim? (`DA` / `NU`)
  - `K k` — al `k`-lea număr prim (numerotat de la 1) sau `NU EXISTA` dacă sunt mai puțin de `k` prime până la `N`;
  - `I a b` — câte numere prime sunt în intervalul `[a, b]`.

  **Date de intrare**

  Pe prima linie `N q`, apoi `q` linii, câte o întrebare.

  **Date de ieșire**

  Pe prima linie `prime pana la <N>: <numarul de prime>`, apoi câte o linie cu răspunsul fiecărei întrebări.

  **Restricții**

  - `2 ≤ N ≤ 10^7`, `1 ≤ q ≤ 10^5`
  - `1 ≤ x ≤ N`, `1 ≤ k ≤ 10^7`, `1 ≤ a ≤ b ≤ N`
  - parcurgerea intervalului `[a, b]` la fiecare întrebare `I` este prea lentă; fiecare întrebare trebuie rezolvată în `O(log N)`

  **Exemplu**

  Intrare:
  ```
  30 7
  P 29
  P 1
  K 10
  K 11
  I 10 20
  I 2 2
  P 30
  ```

  Ieșire:
  ```
  prime pana la 30: 10
  DA
  NU
  29
  NU EXISTA
  4
  1
  NU
  ```
