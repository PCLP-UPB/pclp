hints:
  - "Ciurul: `calloc(n + 1, sizeof(char))` dă un vector plin de zerouri („nimic tăiat încă”). Pentru fiecare `i` de la 2 la `n` rămas netăiat, tai multiplii lui începând de la `i * i`. Ce a rămas netăiat (de la 2 încolo) e prim."
  - "Cu numerele prime într-un vector sortat, toate întrebările se reduc la „câte prime sunt ≤ x?”, care se află prin căutare binară: `I a b` = cate(b) − cate(a − 1), iar `x` este prim dacă cate(x) − cate(x − 1) = 1. Pentru `K k`, răspunsul e direct `p[k − 1]`, dacă `k ≤ cnt`."
  - "Pseudocod cate_cel_mult: st = 0, dr = cnt; cât timp st < dr: mij = (st + dr) / 2; dacă p[mij] ≤ x atunci st = mij + 1, altfel dr = mij. Returnează st. Atenție la ciur: `i * i` depășește `int` pentru `i > 46340`, deci compară în `long long` sau oprește bucla exterioară la `i * i > n`."
pitfalls:
  - "`char ciur[10000001];` ca variabilă locală depășește stiva și programul se oprește cu „segmentation fault” înainte să facă ceva."
  - "Vectorul de prime trebuie alocat după numărare, cu `cnt * sizeof(int)` octeți; ciurul are elemente de un octet, vectorul de prime de patru."
  - "Ciurul trebuie eliberat în funcție, înainte de `return` — altfel rămân 10 MB neeliberați."
