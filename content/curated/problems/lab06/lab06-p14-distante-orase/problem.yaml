hints:
  - "Fiecare linie se alocă separat, deci poate avea propria lungime: linia `i` are nevoie de `(i + 1) * sizeof(int)` octeți. Total: `n(n+1)/2` elemente în loc de `n²`."
  - "Distanța dintre `a` și `b` se află la `t[a-1][b-1]` doar dacă `a ≥ b`; altfel elementul acela nu există în memorie și trebuie citit `t[b-1][a-1]`. Pune această regulă într-un singur loc — funcția `distanta`."
  - "La un itinerariu, citește toate cele `k` orașe chiar dacă unul e invalid (altfel restul liniei e citit ca alt itinerariu). Ține minte orașul anterior și adună distanța doar cât timp toate orașele de până acum sunt valide."
pitfalls:
  - "`t[a][b]` cu `b > a` citește în afara liniei `a` — comportament nedefinit, chiar dacă uneori dă o valoare plauzibilă."
  - "Nu uita diagonala: `t[i][i] = 0` nu vine din intrare, dar itinerariile pot repeta un oraș (`4 4`)."
  - "Verifică orașul înainte să-l folosești ca indice."
