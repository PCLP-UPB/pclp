hints:
  - "Desenează vectorul pe hârtie pentru exemplu, după fiecare comandă, cu `head` marcat. Al `k`-lea element al cozii (de la 0) este `buf[(head + k) % cap]`; noul element se pune pe poziția `(head + size) % cap`."
  - "La mărire coada e plină, deci ocupă tot vectorul: bucata `buf[head .. cap-1]` este începutul cozii, iar `buf[0 .. head-1]` este finalul ei. După `realloc` (care copiază zona așa cum e), mută prima bucată la capătul zonei noi și actualizează `head`; altfel între cele două bucăți apar elemente neinițializate."
  - "La micșorare nu poți face direct `realloc` mai mic: elementele cozii pot sta chiar în partea care se taie. Cel mai simplu: aloci o zonă nouă de `cap / 2` elemente, copiezi cele `size` elemente în ordine (de la 0), eliberezi zona veche și pui `head = 0`. Funcțiile primesc `int **buf` pentru că pot schimba adresa vectorului din `main`."
pitfalls:
  - "`*buf[i]` înseamnă `*(buf[i])`; elementul `i` al vectorului este `(*buf)[i]`."
  - "Dacă la mărire nu refaci ordinea când `head > 0`, testele trec până la prima „întoarcere” a cozii și apoi afișează valori greșite."
  - "Calculează pozițiile cu `% cap` folosind capacitatea curentă — după mărire sau micșorare ea s-a schimbat."
  - "`R` pe o coadă plină nu are nevoie de spațiu nou: primul element se mută pe poziția eliberată chiar de el."
