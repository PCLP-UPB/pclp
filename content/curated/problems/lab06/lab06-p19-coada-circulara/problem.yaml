id: lab06-p19-coada-circulara
lab: lab06
number: 19
title: "Coada de la secretariat"
difficulty: 4
estimated_minutes: 50
concepts: [vector extensibil, dublarea capacității, realloc, pointer la pointer, parametru de tip pointer, realocare prin pointer auxiliar]
statement: |
  În prima săptămână din semestru, la secretariat se formează o coadă uriașă. Simulați coada: studenții (identificați prin numărul legitimației) sosesc la final, sunt serviți de la început, iar cine nu are actele complete este trimis la finalul cozii.

  Coada se memorează ca o **coadă circulară** într-un vector alocat dinamic `buf` cu `cap` elemente: primul student este `buf[head]`, următorii `buf[(head + 1) % cap]`, `buf[(head + 2) % cap]`, … (`size` studenți în total). Astfel, servirea primului student nu mută niciun element — doar avansează `head`. Inițial `buf = NULL`, `cap = head = size = 0`.

  **Politica de capacitate** (trebuie respectată exact):

  - la sosire, dacă `size == cap`, capacitatea devine 2 (dacă era 0) sau se dublează;
  - după servire, dacă `cap > 2` și `size <= cap / 4` (împărțire întreagă), capacitatea se înjumătățește;
  - trimiterea la final nu schimbă capacitatea.

  La mărire, dacă studenții „se întorceau” peste capătul vectorului (`head > 0`), după `realloc` ordinea lor trebuie refăcută; la micșorare, studenții trebuie aduși în zona care rămâne. Implementați și folosiți:

  ```c
  int coada_adauga(int **buf, int *cap, int *head, int *size, int x);   /* 1 = succes, 0 = eroare */
  int coada_scoate(int **buf, int *cap, int *head, int *size, int *x);  /* 1 = succes, 0 = coada goala */
  ```

  Comenzi:

  | comandă | efect |
  |---|---|
  | `+ x` | sosește studentul `x` |
  | `-` | primul student e servit; afișează-i numărul |
  | `R` | primul student trece la finalul cozii |
  | `K k` | afișează al `k`-lea student de la începutul cozii (de la 1) sau `EROARE` |
  | `T` | afișează `size=<size> cap=<cap>` |
  | `P` | afișează `[<size>]` urmat de studenți, în ordine, fiecare precedat de un spațiu |

  Pentru `-` și `R` pe coada goală se afișează `COADA GOALA`.

  **Date de intrare**

  Pe prima linie `q`, apoi `q` comenzi, câte una pe linie.

  **Date de ieșire**

  Rezultatele comenzilor `-`, `K`, `T`, `P` și mesajele de eroare, câte unul pe linie.

  **Restricții**

  - `1 ≤ q ≤ 200000`; numerele legitimațiilor sunt întregi din `[1, 10^6]`; `k` este un întreg din `[-10, 300000]`
  - fiecare comandă `+`, `-`, `R`, `K` trebuie executată în `O(1)` (amortizat); mutarea tuturor elementelor la fiecare servire este prea lentă

  **Exemplu**

  Intrare:
  ```
  16
  + 1
  + 2
  + 3
  -
  + 4
  + 5
  P
  + 6
  K 5
  R
  T
  -
  -
  -
  T
  P
  ```

  Ieșire:
  ```
  1
  [4] 2 3 4 5
  6
  size=5 cap=8
  3
  4
  5
  size=2 cap=4
  [2] 6 2
  ```

  Explicație: după `+ 5` vectorul de 4 elemente este `5 2 3 4` cu `head = 1` (coada „s-a întors”); la `+ 6` capacitatea devine 8, iar ordinea `2 3 4 5` trebuie păstrată. După al treilea `-` din final rămân 2 studenți, `2 <= 8 / 4`, deci capacitatea scade la 4.
