id: lab06-p20-tetris-bare
lab: lab06
number: 20
title: "Tetris cu bare"
difficulty: 5
estimated_minutes: 70
concepts: [vector de pointeri, matrice alocată dinamic, realloc, calloc, eliberarea unei matrice, dublarea capacității, memory leak]
statement: |
  Pentru concursul de jocuri retro din cămin, scrieți motorul unui Tetris simplificat. Tabla are lățimea `w` (coloane numerotate de la 1 la `w`) și **nu are înălțime maximă**. Cad doar bare:

  - `O L c` — o bară orizontală de lungime `L`, care ocupă coloanele `c, c+1, …, c+L-1`; ea coboară până se oprește pe cea mai înaltă celulă ocupată de sub ea (sau pe fundul tablei) și ocupă o singură linie;
  - `V H c` — o bară verticală de înălțime `H` în coloana `c`; se așază deasupra celei mai înalte celule ocupate din coloana `c` și ocupă `H` linii consecutive;
  - `A` — afișează tabla.

  O bară care ar ieși din tablă pe orizontală (`c < 1` sau ultima ei coloană `> w`) este **invalidă**: se ignoră și se numără. După așezarea unei bare, orice linie complet plină dispare, iar tot ce era deasupra ei coboară cu o linie (golurile rămân goluri — nu există „gravitație” pentru celule).

  Tabla se memorează ca un **vector de pointeri la linii**, cu linia de jos pe poziția 0. Fiecare linie are `w` celule și se alocă separat (cu `calloc`). Când o bară ajunge mai sus decât tabla actuală, se adaugă linii noi, iar vectorul de pointeri își **dublează capacitatea** când e nevoie. Când o linie dispare, ea se eliberează și pointerii liniilor de deasupra coboară cu o poziție (nu se copiază celule). Implementați și folosiți cel puțin:

  ```c
  char **adauga_linii(char **t, int *h, int *cap, int nou_h, int w);   /* NULL la eroare */
  void elimina_linia(char **t, int *h, int r);
  void elibereaza_tabla(char **t, int h);
  ```

  unde `h` este numărul de linii folosite, iar `cap` numărul de pointeri alocați.

  **Date de intrare**

  Pe prima linie `w q`, apoi `q` comenzi, câte una pe linie.

  **Date de ieșire**

  La fiecare `A`, o linie `inaltime: <h>` urmată de cele `h` linii ale tablei, **de sus în jos**, cu `#` pentru celulă ocupată și `.` pentru celulă goală. Înălțimea `h` este numărul de linii până la cea mai înaltă celulă ocupată (0 pentru tabla goală). La final:

  ```
  piese plasate: <numar>
  piese invalide: <numar>
  linii eliminate: <numar>
  ```

  urmat de tabla finală, în același format ca la `A`.

  **Restricții**

  - `1 ≤ w ≤ 50`, `1 ≤ q ≤ 5000`
  - `1 ≤ L ≤ 50`, `1 ≤ H ≤ 20`; `c` este un întreg din `[-100, 100]`
  - numărul total de linii afișate de comenzile `A` este cel mult `10^5`

  **Exemplu**

  Intrare:
  ```
  4 11
  O 3 1
  V 2 4
  O 2 2
  V 3 1
  A
  O 4 0
  O 3 2
  O 2 3
  V 1 2
  A
  V 2 3
  ```

  Ieșire:
  ```
  inaltime: 2
  #...
  #...
  inaltime: 0
  piese plasate: 8
  piese invalide: 1
  linii eliminate: 4
  inaltime: 2
  ..#.
  ..#.
  ```

  Explicație: `O 3 1` și partea de jos a lui `V 2 4` completează prima linie, care dispare; jumătatea de sus a barei verticale coboară pe fund. `O 2 2` aterizează pe fund, lângă ea, iar `V 3 1` completează linia de jos (care dispare și ea), rămânând două celule în coloana 1. `O 4 0` este invalidă.
