hints:
  - "Ține un vector `inalt` (alocat dinamic, `w` elemente): `inalt[x]` = numărul de linii până la cea mai înaltă celulă ocupată din coloana `x`. O bară orizontală aterizează pe linia `max(inalt[c..c+L-1])`, iar una verticală începe pe linia `inalt[c]`. Linia de sus a barei poate depăși `h` — atunci chemi `adauga_linii` cu noua înălțime."
  - "După așezare, verifică doar liniile ocupate de bară, **de sus în jos**: dacă elimini o linie, cele de dedesubt își păstrează indicii. Eliminarea liniei `r`: `free(t[r])`, `t[i] = t[i+1]` pentru `i` de la `r` la `h-2`, `h--`. Capacitatea vectorului de pointeri poate rămâne aceeași."
  - "Actualizarea lui `inalt` după eliminarea liniei pline `r`: dacă `inalt[x] > r + 1`, vârful coloanei era deasupra și coboară cu 1; dacă `inalt[x] == r + 1`, vârful a dispărut, deci cauți în jos, de la linia `r - 1`, prima celulă ocupată din coloana `x`. Afișarea parcurge liniile de la `h - 1` la 0. La final: fiecare linie, apoi vectorul de pointeri, apoi `inalt`."
pitfalls:
  - "Eliberarea liniei după ce ai mutat pointerii eliberează linia greșită și pierde linia plină (memory leak + date corupte)."
  - "Liniile noi trebuie să fie goale: `malloc` fără inițializare lasă celule „ocupate” la întâmplare; folosește `calloc`."
  - "`realloc` pe vectorul de pointeri poate muta vectorul: funcția trebuie să returneze noua adresă, iar `main` să o folosească."
  - "Dacă verifici liniile de jos în sus și elimini una, linia următoare de verificat a coborât pe poziția celei eliminate."
