  int main(void)
  {
      int q, id, i, cap = 0;
      char op;
      int *vizite = NULL;

      scanf("%d", &q);
      for (i = 0; i < q; i++) {
          scanf(" %c %d", &op, &id);
          /* TODO: V -> asigura_capacitate + incrementare; ? -> afisare */
      }

      /* TODO: capacitate, pagini vizitate, cea mai vizitata */

      free(vizite);
      return 0;
  }
hints:
  - "Vectorul de contoare e un vector de frecvență a cărui lungime nu se știe dinainte. Indicele `id` trebuie să fie mai mic decât capacitatea; dacă nu e, vectorul trebuie mărit înainte de incrementare."
  - "`realloc` păstrează valorile vechi, dar **nu inițializează** elementele noi — ele conțin valori „gunoi”. După realocare, pune pe 0 elementele de la vechea capacitate până la cea nouă. `realloc(NULL, dim)` se comportă ca `malloc`, deci prima vizită nu e un caz special."
  - "La o întrebare, dacă `id ≥ cap` pagina sigur nu a fost vizitată: răspunsul e 0, fără realocare (altfel capacitatea finală iese greșită). Pseudocod asigura_capacitate: dacă id < *cap returnează v; nou = max(2 · *cap, id + 1); tmp = realloc(v, nou · sizeof(int)); dacă tmp == NULL returnează NULL; zerorizează tmp[*cap .. nou-1]; *cap = nou; returnează tmp."
pitfalls:
  - "Citirea `vizite[id]` pentru `id ≥ cap` este acces în afara zonei alocate — comportament nedefinit, chiar dacă uneori „merge”."
  - "Actualizează `*cap` doar după ce realocarea a reușit."
  - "Dacă la o întrebare mărești vectorul, capacitatea afișată la final nu mai respectă regula."
