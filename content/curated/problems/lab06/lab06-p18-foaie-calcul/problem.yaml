hints:
  - "Desenează cele două niveluri: vectorul de pointeri (lungime `r`) și liniile (lungime `c` fiecare). `L` și `X` modifică doar vectorul de pointeri (plus o linie alocată sau eliberată); `C` și `Y` modifică toate liniile, dar nu și vectorul de pointeri."
  - "Ștergerea liniei `i`: eliberezi linia, muți pointerii `t[i+1..r-1]` cu o poziție la stânga (se mută adrese, nu valori), apoi micșorezi vectorul. Ștergerea coloanei `j`: în fiecare linie muți elementele de după `j` la stânga și micșorezi linia. Când o dimensiune ajunge la 0, folosește `free` și pune pointerul pe `NULL`, nu `realloc(p, 0)`."
  - "Transpusa are `c` linii de câte `r` elemente: `nou[j][i] = t[i][j]`. În `main`: `nou = transpune(t, r, c, &ok)`, apoi `elibereaza(t, r)` (cu vechiul `r`!), apoi `t = nou` și interschimbi `r` cu `c`. Cazuri limită: `T` pe `2 x 0` dă `0 x 2` (vector de pointeri `NULL`), iar `T` pe `0 x 2` dă `2 x 0` (doi pointeri `NULL`)."
pitfalls:
  - "`realloc(p, 0)` nu are un comportament garantat; tratează explicit dimensiunea 0."
  - "Dacă la `C` aloci din nou fiecare linie cu `malloc` (fără să copiezi), pierzi valorile și memoria veche."
  - "Eliberarea tabelului vechi după `T` trebuie făcută cu numărul lui de linii, înainte să interschimbi `r` și `c`."
  - "La `adauga_linie`, dacă alocarea liniei sau `realloc` eșuează, tabelul vechi trebuie să rămână valid."
