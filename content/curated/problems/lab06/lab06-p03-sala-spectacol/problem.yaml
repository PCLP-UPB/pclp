hints:
  - "O matrice cu rânduri de lungimi diferite se construiește dintr-un vector de pointeri (`int **`), în care fiecare pointer indică un rând alocat separat, cu lungimea lui."
  - "`calloc(nr, sizeof(int))` alocă și pune toate valorile pe 0 — exact „toate locurile libere”. Pentru vectorul de pointeri, dimensiunea unui element este `sizeof(int *)`."
  - "La o cerere, verifică în ordine: 1 ≤ r ≤ n, apoi 1 ≤ s ≤ locuri[r-1], apoi sala[r-1][s-1]. La eliberare: free pentru fiecare rând, apoi free(sala), apoi free(locuri)."
pitfalls:
  - "`free(sala)` singur nu eliberează rândurile — rămân `n` zone pierdute (memory leak)."
  - "Nu citi `locuri[r - 1]` înainte să verifici că `r` e un rând valid."
