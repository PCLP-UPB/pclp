hints:
  - "Gândește pas cu pas: dacă știi în câte moduri obții fiecare sumă cu primele `i` zaruri, atunci cu zarul `i+1` fiecare sumă veche `s` și fiecare față `v` contribuie cu `dist[s]` moduri la suma `s + v`."
  - "Suma maximă nouă este `smax` plus cea mai mare valoare de pe zar. Vectorul nou trebuie să pornească plin de zerouri, pentru că doar aduni în el — `calloc` face exact asta."
  - "În `main`, la fiecare zar: citești fețele (malloc), `nou = adauga_zar(...)`, `free(fete)`, `free(dist)`, `dist = nou`, `smax = smax_nou`. Ordinea contează: nu elibera `dist` înainte de apel. Totalul de combinații este produsul numerelor de fețe, în `long long`."
pitfalls:
  - "Dacă nu eliberezi distribuția veche la fiecare zar, programul pierde `k` vectori; dacă o eliberezi înainte să construiești distribuția nouă, citești memorie eliberată."
  - "`malloc` în loc de `calloc` pentru distribuția nouă lasă valori „gunoi” în sumele la care doar aduni."
  - "Numerele de moduri ajung la `20^10`: `int` nu ajunge, folosește `long long` și `%lld`."
