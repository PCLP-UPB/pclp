id: lab06-p01-timpi-alergare
lab: lab06
number: 1
title: "Timpii de la maraton"
difficulty: 1
estimated_minutes: 15
concepts: [malloc, free, vector alocat dinamic, verificarea rezultatului alocării, pointer returnat de funcție]
statement: |
  La un semimaraton s-au înregistrat timpii (în secunde) ai celor `n` alergători. Numărul de alergători diferă de la o cursă la alta și poate fi foarte mare, așa că vectorul de timpi trebuie **alocat dinamic**, exact cât e nevoie.

  Afișați timpul mediu și alergătorii care au avut un timp **strict mai mic** decât media, în ordinea din intrare.

  Implementați și folosiți funcția:

  ```c
  int *citeste_timpi(int *n);
  ```

  care citește `n` (transmis apelantului prin pointer), alocă vectorul, citește elementele și returnează adresa vectorului (sau `NULL` dacă alocarea eșuează). Eliberați memoria înainte de terminarea programului.

  **Date de intrare**

  Pe prima linie `n`, pe a doua `n` numere întregi pozitive.

  **Date de ieșire**

  ```
  medie: <media cu 2 zecimale>
  sub medie: <timpii sub medie, fiecare precedat de un spatiu>
  total: <cati timpi sunt sub medie>
  ```

  **Restricții**

  - `1 ≤ n ≤ 100000`
  - `1 ≤ timp ≤ 100000`

  **Exemplu**

  Intrare:
  ```
  6
  1520 1490 1610 1455 1700 1530
  ```

  Ieșire:
  ```
  medie: 1550.83
  sub medie: 1520 1490 1455 1530
  total: 4
  ```
