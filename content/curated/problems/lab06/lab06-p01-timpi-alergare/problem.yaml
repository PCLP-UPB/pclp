hints:
  - "Un vector alocat cu `malloc` „supraviețuiește” ieșirii din funcție, spre deosebire de un vector local — de aceea funcția poate returna adresa lui."
  - "Dimensiunea dată lui `malloc` e în octeți: numărul de elemente înmulțit cu `sizeof(int)`. Verifică dacă rezultatul e `NULL`, iar la final apelează `free`."
  - "Suma poate ajunge la 10^10, deci ține-o într-un `long long`. Un timp `t` e sub medie dacă `t < suma / n`, adică (fără împărțire) `t * n < suma`."
pitfalls:
  - "`malloc(n)` alocă doar `n` octeți, nu `n` întregi."
  - "Nu returna adresa unui vector declarat local în funcție."
  - "Fiecare `malloc` trebuie să aibă un `free` corespunzător."
