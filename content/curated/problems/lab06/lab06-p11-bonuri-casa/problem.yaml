id: lab06-p11-bonuri-casa
lab: lab06
number: 11
title: "Bonurile de la cele două case"
difficulty: 1
estimated_minutes: 15
concepts: [malloc, free, vector alocat dinamic, pointer returnat de funcție, interclasare]
statement: |
  Magazinul de lângă cămin are două case de marcat. Fiecare casă păstrează momentele la care a emis bonuri (în secunde de la deschiderea magazinului), **în ordine crescătoare**. La închidere, administratorul vrea un singur jurnal al zilei, cu toate bonurile în ordine cronologică.

  Citiți cele două liste în vectori alocați dinamic, construiți jurnalul comun într-un **al treilea vector alocat dinamic**, de exact `n + m` elemente, și afișați:

  - numărul total de bonuri;
  - jurnalul comun, sortat crescător;
  - mediana: elementul de pe poziția `(n + m - 1) / 2` din jurnal (numerotat de la 0, împărțire întreagă);
  - cea mai lungă pauză dintre două bonuri consecutive din jurnal și momentele dintre care a avut loc (dacă există mai multe pauze maxime, prima dintre ele).

  Implementați și folosiți funcțiile:

  ```c
  int *citeste_vector(int n);
  int *interclaseaza(const int *a, int n, const int *b, int m);
  ```

  `citeste_vector` alocă un vector de `n` elemente, îl citește și îi returnează adresa; `interclaseaza` alocă și completează jurnalul comun. Ambele returnează `NULL` dacă alocarea eșuează. Vectorii inițiali pot fi eliberați imediat după interclasare; la final nu trebuie să rămână memorie neeliberată.

  **Date de intrare**

  Pe prima linie `n`, pe a doua `n` momente (casa 1). Pe a treia linie `m`, pe a patra `m` momente (casa 2). Ambele liste sunt sortate crescător (nedescrescător).

  **Date de ieșire**

  ```
  total: <n + m>
  bonuri: <jurnalul comun, fiecare moment precedat de un spatiu>
  mediana: <valoare>
  pauza maxima: <durata> (intre <t1> si <t2>)
  ```

  **Restricții**

  - `1 ≤ n, m ≤ 100000`
  - `0 ≤ moment ≤ 10^6`

  **Exemplu**

  Intrare:
  ```
  4
  120 300 305 900
  3
  200 305 1500
  ```

  Ieșire:
  ```
  total: 7
  bonuri: 120 200 300 305 305 900 1500
  mediana: 305
  pauza maxima: 600 (intre 900 si 1500)
  ```
