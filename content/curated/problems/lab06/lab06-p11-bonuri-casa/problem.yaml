hints:
  - "Lungimea jurnalului se știe abia după citirea lui `n` și `m`, deci vectorul rezultat se alocă în `interclaseaza`, cu `(n + m) * sizeof(int)` octeți, și se returnează apelantului."
  - "Interclasarea folosește trei indici: `i` în `a`, `j` în `b`, `k` în rezultat. Cât timp ambele liste mai au elemente, copiezi elementul mai mic (la egalitate, pe cel din `a`); apoi copiezi ce a rămas din lista neterminată."
  - "Pauza dintre bonurile `k-1` și `k` este `c[k] - c[k-1]`. Pornește cu pauza dintre primele două bonuri și actualizează doar la o pauză strict mai mare, ca să rămână prima. La final: trei apeluri `free` — pentru `a`, `b` și jurnal."
pitfalls:
  - "`malloc(n + m)` alocă `n + m` octeți, nu `n + m` întregi."
  - "Uitarea celor două bucle de la final (elementele rămase dintr-o singură listă) lasă jurnalul incomplet."
  - "Dacă eliberezi `a` și `b` înainte de interclasare, `interclaseaza` citește memorie eliberată."
