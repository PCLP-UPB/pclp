  }

  void citeste_matrice(int **a, int n, int m)
  {
      /* TODO */
  }

  void elibereaza_matrice(int **a, int n)
  {
      /* TODO: intai liniile, apoi vectorul de pointeri */
  }

  int main(void)
  {
      int n, m;
      int **parcare;

      scanf("%d %d", &n, &m);
      parcare = aloca_matrice(n, m);
      if (parcare == NULL) {
          return 1;
      }
      citeste_matrice(parcare, n, m);

      /* TODO: locuri libere pe etaje, cel mai liber etaj, locuri libere peste tot */

      elibereaza_matrice(parcare, n);
      return 0;
  }
hints:
  - "O matrice alocată dinamic are două niveluri: un vector de `n` elemente de tip `int *` (adresele liniilor) și `n` linii de câte `m` întregi. După alocare o folosești exact ca pe o matrice obișnuită: `a[i][j]`."
  - "Vectorul de pointeri se alocă cu `n * sizeof(int *)`, fiecare linie cu `m * sizeof(int)`. Eliberarea se face în ordine inversă: întâi fiecare linie, apoi vectorul de pointeri."
  - "Locul `j` e liber peste tot dacă pe coloana `j` nu apare niciun `1`: parcurgi coloana de sus în jos și te oprești la primul loc ocupat. Pentru etajul cel mai liber actualizezi maximul doar la o valoare strict mai mare."
pitfalls:
  - "`malloc(n * sizeof(int))` pentru vectorul de pointeri e greșit pe sistemele pe 64 de biți, unde un pointer are 8 octeți, iar un `int` 4."
  - "`free(parcare)` singur lasă toate cele `n` linii neeliberate."
  - "Numerotarea etajelor și a locurilor începe de la 1 în ieșire, dar indicii din matrice încep de la 0."
